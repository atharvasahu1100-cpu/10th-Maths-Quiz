<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>गणित वीकली टेस्ट</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #74b9ff, #0984e3);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 480px;
            background: #ffffff;
            padding: 25px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        .header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #f1f2f6;
            padding-bottom: 12px;
            margin-bottom: 20px;
        }
        h2 { color: #2d3436; font-size: 20px; margin: 0; }
        .timer-box {
            background: #e74c3c;
            color: white;
            padding: 6px 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
        }
        .question-box { margin-bottom: 20px; }
        .question-title { font-size: 16px; color: #2d3436; font-weight: bold; margin-bottom: 15px; }
        .option-label {
            display: block;
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            padding: 12px 15px;
            margin: 8px 0;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
            font-size: 15px;
        }
        .option-label:hover { background: #e3f2fd; border-color: #74b9ff; }
        input[type="radio"] { margin-right: 10px; }
        input[type="text"], input[type="tel"] {
            width: 100%;
            padding: 12px;
            margin: 8px 0 15px 0;
            border: 2px solid #dfe6e9;
            border-radius: 10px;
            font-size: 15px;
        }
        .btn {
            width: 100%;
            background: linear-gradient(135deg, #0984e3, #74b9ff);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin-top: 10px;
        }
        .btn-back {
            background: #636e72;
            margin-top: 8px;
        }
        .hidden { display: none; }
        .success-msg { text-align: center; color: #27ae60; font-size: 20px; font-weight: bold; padding: 30px 0; }
    </style>
</head>
<body>

<div class="container" id="app">
    <!-- स्टेप 1: छात्र की जानकारी -->
    <div id="info-screen">
        <h2>⚡ गणित साप्ताहिक टेस्ट - अध्याय 1</h2>
        <p style="color: #636e72; font-size: 14px; margin-bottom: 20px;">सभी प्रश्न अनिवार्य हैं। सही जानकारी भरें।</p>
        
        <label><b>छात्र का पूरा नाम:</b></label>
        <input type="text" id="studentName" placeholder="अपना पूरा नाम लिखें">
        
        <label><b>मोबाइल नंबर:</b></label>
        <input type="tel" id="studentMobile" placeholder="अपना मोबाइल नंबर लिखें">
        
        <button class="btn" onclick="startQuiz()">टेस्ट शुरू करें</button>
        <button class="btn btn-back" onclick="goHome()">← होम पेज पर वापस जाएं</button>
    </div>

    <!-- स्टेप 2: क्विज़ स्क्रीन -->
    <div id="quiz-screen" class="hidden">
        <div class="header-flex">
            <h2 id="q-number">प्रश्न 1</h2>
            <div class="timer-box" id="timer">समय: 10:00</div>
        </div>

        <div class="question-box">
            <div class="question-title" id="question-text">प्रश्न यहाँ दिखेगा</div>
            <div id="options-container"></div>
        </div>

        <button class="btn" onclick="nextQuestion()" id="next-btn">अगला प्रश्न</button>
    </div>

    <!-- स्टेप 3: सफलता स्क्रीन -->
    <div id="success-screen" class="hidden">
        <div class="success-msg">🎉 आपका टेस्ट सफलतापूर्वक सबमिट हो गया है!</div>
        <p style="text-align: center; color: #636e72;">आपके उत्तर रिकॉर्ड कर लिए गए हैं।</p>
        <button class="btn" onclick="goHome()">होम पेज पर वापस जाएं</button>
    </div>
</div>

<script>
    // यहाँ आप अपने सवाल और उनके सही जवाब सेट कर सकते हैं
    const questions = [
        {
            question: "संख्याओं 26 और 91 का HCF क्या होगा?",
            options: ["(A) 13", "(B) 26", "(C) 7", "(D) 91"],
            answer: 0 // (A) सही है
        },
        {
            question: "संख्याओं 96 और 404 का HCF कितना होगा?",
            options: ["(A) 2", "(B) 3", "(C) 4", "(D) 8"],
            answer: 2 // (C) सही है
        }
    ];

    let currentQuestionIndex = 0;
    let score = 0;
    let studentData = { name: "", mobile: "" };
    let timerInterval;
    let timeLeft = 600; // 10 मिनट

    function startQuiz() {
        const name = document.getElementById("studentName").value.trim();
        const mobile = document.getElementById("studentMobile").value.trim();

        if (name === "" || mobile === "") {
            alert("कृपया अपना नाम और मोबाइल नंबर दोनों भरें!");
            return;
        }

        studentData.name = name;
        studentData.mobile = mobile;

        document.getElementById("info-screen").classList.add("hidden");
        document.getElementById("quiz-screen").classList.remove("hidden");

        loadQuestion();
        startTimer();
    }

    function loadQuestion() {
        const q = questions[currentQuestionIndex];
        document.getElementById("q-number").innerText = `प्रश्न ${currentQuestionIndex + 1} / ${questions.length}`;
        document.getElementById("question-text").innerText = q.question;

        const optionsContainer = document.getElementById("options-container");
        optionsContainer.innerHTML = "";

        q.options.forEach((opt, index) => {
            optionsContainer.innerHTML += `
                <label class="option-label">
                    <input type="radio" name="quiz-option" value="${index}"> ${opt}
                </label>
            `;
        });

        if (currentQuestionIndex === questions.length - 1) {
            document.getElementById("next-btn").innerText = "टेस्ट सबमिट करें";
        }
    }

    function nextQuestion() {
        const selectedOption = document.querySelector('input[name="quiz-option"]:checked');
        if (!selectedOption) {
            alert("कृपया किसी एक विकल्प का चयन करें!");
            return;
        }

        const answerIndex = parseInt(selectedOption.value);
        if (answerIndex === questions[currentQuestionIndex].answer) {
            score++;
        }

        currentQuestionIndex++;

        if (currentQuestionIndex < questions.length) {
            loadQuestion();
        } else {
            submitQuiz();
        }
    }

    function startTimer() {
        timerInterval = setInterval(() => {
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                submitQuiz();
                return;
            }
            timeLeft--;
            let mins = Math.floor(timeLeft / 60);
            let secs = timeLeft % 60;
            document.getElementById("timer").innerText = `समय: ${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }, 1000);
    }

    function submitQuiz() {
        clearInterval(timerInterval);
        document.getElementById("quiz-screen").classList.add("hidden");
        document.getElementById("success-screen").classList.remove("hidden");

        // डेटा कंसोल में दिखेगा (बाद में इसे गूगल शीट से जोड़ा जा सकता है)
        console.log("Student:", studentData, "Score:", score);
    }

    function goHome() {
        window.location.href = "index.html";
    }
</script>

</body>
</html>
