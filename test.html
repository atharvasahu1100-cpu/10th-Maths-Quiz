<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>वीकली टाइमर टेस्ट - गणित</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #74b9ff, #0984e3); 
            margin: 0; 
            padding: 20px; 
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container { 
            width: 100%; 
            max-width: 500px; 
            background: #ffffff; 
            padding: 25px 20px; 
            border-radius: 20px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.2); 
            max-height: 90vh;
            overflow-y: auto;
        }
        .header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #f1f2f6;
            padding-bottom: 12px;
            margin-bottom: 20px;
        }
        h1 { 
            color: #2d3436; 
            font-size: 20px; 
            margin: 0; 
        }
        #timer {
            background: #d63031;
            color: white;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
        }
        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }
        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            color: #2d3436;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 2px solid #dfe6e9;
            border-radius: 10px;
            font-size: 15px;
        }
        .question-box {
            font-size: 16px;
            color: #2d3436;
            margin-bottom: 15px;
            font-weight: bold;
            text-align: left;
        }
        .option-item {
            display: block;
            width: 100%;
            padding: 10px 15px;
            margin: 8px 0;
            background: #f1f2f6;
            border: 2px solid #dfe6e9;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
            text-align: left;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background: #0984e3;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn:hover { background: #074b83; }
        .report-box {
            background: #f1f2f6;
            padding: 15px;
            border-radius: 10px;
            text-align: left;
            margin-bottom: 15px;
            color: #2d3436;
        }
        .back-btn { 
            display: block;
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            background: #636e72; 
            color: white; 
            border-radius: 10px; 
            text-decoration: none; 
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container" id="app">
    <div class="header-flex">
        <h1 id="page-title">⚡ वीकली टेस्ट</h1>
        <div id="timer" style="display:none;">समय: <span id="time-left">10:00</span></div>
    </div>

    <!-- 1. लॉगिन सेक्शन -->
    <div id="login-section">
        <div class="form-group">
            <label>छात्र का पूरा नाम:</label>
            <input type="text" id="student-name" placeholder="अपना नाम लिखें">
        </div>
        <div class="form-group">
            <label>मोबाइल नंबर:</label>
            <input type="tel" id="student-phone" placeholder="अपना मोबाइल नंबर लिखें">
        </div>
        <button class="btn" onclick="startTest()">टेस्ट शुरू करें</button>
    </div>

    <!-- 2. क्विज़ सेक्शन (10 प्रश्न) -->
    <div id="quiz-section" style="display:none;">
        <div id="question-container"></div>
        <button class="btn" id="next-btn" onclick="nextQuestion()">अगला प्रश्न</button>
    </div>

    <!-- 3. रिपोर्ट सेक्शन -->
    <div id="report-section" style="display:none;">
        <div class="report-box">
            <p><b>📊 छात्रों के टेस्ट का रिकॉर्ड:</b></p>
            <p>सफलतापूर्वक सभी रिकॉर्ड यहाँ अपडेट किए जाएंगे।</p>
        </div>
    </div>

    <a href="index.html" class="back-btn">← होम पेज पर वापस जाएं</a>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    if(urlParams.get('view') === 'report') {
        document.getElementById('login-section').style.display = 'none';
        document.getElementById('quiz-section').style.display = 'none';
        document.getElementById('report-section').style.display = 'block';
        document.getElementById('page-title').textContent = '📊 छात्रों का रिकॉर्ड';
        document.getElementById('timer').style.display = 'none';
    }

    // 10 महत्वपूर्ण प्रश्न
    const questions = [
        { q: "प्रश्न 1: संख्याओं 26 और 91 का HCF क्या होगा?", options: ["(A) 13", "(B) 26", "(C) 7", "(D) 91"], answer: 0 },
        { q: "प्रश्न 2: द्विघात बहुपद $ax^2 + bx + c$ के शून्यांकों का योग होता है?", options: ["(A) c/a", "(B) -b/a", "(C) b/a", "(D) -a/b"], answer: 1 },
        { q: "प्रश्न 3: रैखिक समीकरण युग्म $a_1x + b_1y + c_1 = 0$ और $a_2x + b_2y + c_2 = 0$ के अद्वितीय हल की शर्त है?", options: ["(A) a1/a2 = b1/b2 != c1/c2", "(B) a1/a2 != b1/b2", "(C) a1/a2 = b1/b2 = c1/c2", "(D) इनमें से कोई नहीं"], answer: 1 },
        { q: "प्रश्न 4: द्विघात समीकरण $ax^2 + bx + c = 0$ का विविक्तकर (Discriminant) ज्ञात करने का सूत्र है?", options: ["(A) D = b^2 - 4ac", "(B) D = b^2 + 4ac", "(C) D = a^2 - 4bc", "(D) D = b - 4ac"], answer: 0 },
        { q: "प्रश्न 5: A.P. 2, 7, 12, ... का 10वाँ पद क्या है?", options: ["(A) 45", "(B) 47", "(C) 50", "(D) 55"], answer: 1 },
        { q: "प्रश्न 6: सभी वृत्त होते हैं?", options: ["(A) सर्वांगसम", "(B) समरूप", "(C) समान", "(D) असमान"], answer: 1 },
        { q: "प्रश्न 7: बिंदु (3, 4) की मूल बिंदु से दूरी क्या होगी?", options: ["(A) 3", "(B) 4", "(C) 5", "(D) 7"], answer: 2 },
        { q: "प्रश्न 8: sin(90° - A) किसके बराबर होता है?", options: ["(A) cos A", "(B) tan A", "(C) cot A", "(D) sin A"], answer: 0 },
        { q: "प्रश्न 9: वृत्त की स्पर्श रेखा उसे कितने बिंदुओं पर प्रतिच्छेद करती है?", options: ["(A) 1", "(B) 2", "(C) 3", "(D) अनन्त"], answer: 0 },
        { q: "प्रश्न 10: एक पासे को एक बार फेंका जाता है, एक सम संख्या आने की प्रायिकता क्या है?", options: ["(A) 1/2", "(B) 1/3", "(C) 1/6", "(D) 1"], answer: 0 }
    ];

    let currentQuestion = 0;
    let totalSeconds = 10 * 60;
    let timerInterval;

    function startTimer() {
        document.getElementById('timer').style.display = 'block';
        timerInterval = setInterval(() => {
            let minutes = Math.floor(totalSeconds / 60);
            let seconds = totalSeconds % 60;
            minutes = minutes < 10 ? '0' + minutes : minutes;
            seconds = seconds < 10 ? '0' + seconds : seconds;
            document.getElementById('time-left').textContent = `${minutes}:${seconds}`;

            if (totalSeconds > 0) {
                totalSeconds--;
            } else {
                clearInterval(timerInterval);
                alert("समय समाप्त हो गया है!");
                submitTest();
            }
        }, 1000);
    }

    function startTest() {
        let name = document.getElementById('student-name').value.trim();
        let phone = document.getElementById('student-phone').value.trim();

        if(name === '' || phone === '') {
            alert('कृपया अपना नाम और मोबाइल नंबर दोनों दर्ज करें!');
            return;
        }

        document.getElementById('login-section').style.display = 'none';
        document.getElementById('quiz-section').style.display = 'block';
        startTimer();
        loadQuestion();
    }

    function loadQuestion() {
        if (currentQuestion < questions.length) {
            let q = questions[currentQuestion];
            let html = `<div class="question-box">${q.q}</div>`;
            q.options.forEach((opt, index) => {
                html += `<label class="option-item"><input type="radio" name="quiz_opt" value="${index}"> ${opt}</label>`;
            });
            document.getElementById('question-container').innerHTML = html;
            
            if(currentQuestion === questions.length - 1) {
                document.getElementById('next-btn').textContent = "टेस्ट सबमिट करें";
            }
        }
    }

    function nextQuestion() {
        let selected = document.querySelector('input[name="quiz_opt"]:checked');
        if (!selected) {
            alert("कृपया किसी एक विकल्प का चयन करें!");
            return;
        }

        currentQuestion++;
        if (currentQuestion < questions.length) {
            loadQuestion();
        } else {
            submitTest();
        }
    }

    function submitTest() {
        clearInterval(timerInterval);
        alert("आपका टेस्ट सफलतापूर्वक सबमिट हो गया है!");
        window.location.href = "index.html";
    }
</script>

</body>
</html>
