<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>गणित वीकली टेस्ट और रिपोर्ट</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #74b9ff, #0984e3);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: #ffffff;
            padding: 25px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        .header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #f1f2f6;
            padding-bottom: 12px;
            margin-bottom: 20px;
        }
        h2 { color: #2d3436; font-size: 20px; margin: 0; }
        .timer-box {
            background: #e74c3c;
            color: white;
            padding: 6px 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
        }
        .question-box { margin-bottom: 20px; }
        .question-title { font-size: 16px; color: #2d3436; font-weight: bold; margin-bottom: 15px; line-height: 1.5; }
        .option-label {
            display: block;
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            padding: 12px 15px;
            margin: 8px 0;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
            font-size: 15px;
        }
        .option-label:hover { background: #e3f2fd; border-color: #74b9ff; }
        input[type="radio"] { margin-right: 10px; }
        input[type="text"], input[type="tel"] {
            width: 100%;
            padding: 12px;
            margin: 8px 0 15px 0;
            border: 2px solid #dfe6e9;
            border-radius: 10px;
            font-size: 15px;
        }
        .btn {
            width: 100%;
            background: linear-gradient(135deg, #0984e3, #74b9ff);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin-top: 10px;
        }
        .btn-back { background: #636e72; }
        .hidden { display: none; }
        .success-msg { text-align: center; color: #27ae60; font-size: 20px; font-weight: bold; padding: 20px 0; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #dfe6e9; padding: 10px; text-align: center; font-size: 14px; }
        th { background: #0984e3; color: white; }
    </style>
</head>
<body>

<div class="container" id="app">
    <!-- स्टेप 1: छात्र की जानकारी -->
    <div id="info-screen">
        <h2>⚡ गणित साप्ताहिक टेस्ट - अध्याय 1</h2>
        <p style="color: #636e72; font-size: 14px; margin-bottom: 20px;">सभी प्रश्न अनिवार्य हैं। सही जानकारी भरें।</p>
        
        <label><b>छात्र का पूरा नाम:</b></label>
        <input type="text" id="studentName" placeholder="अपना पूरा नाम लिखें">
        
        <label><b>मोबाइल नंबर:</b></label>
        <input type="tel" id="studentMobile" placeholder="अपना मोबाइल नंबर लिखें">
        
        <button class="btn" onclick="startQuiz()">टेस्ट शुरू करें</button>
        <button class="btn btn-back" onclick="goHome()">← होम पेज पर वापस जाएं</button>
    </div>

    <!-- स्टेप 2: क्विज़ स्क्रीन -->
    <div id="quiz-screen" class="hidden">
        <div class="header-flex">
            <h2 id="q-number">प्रश्न 1</h2>
            <div class="timer-box" id="timer">समय: 10:00</div>
        </div>

        <div class="question-box">
            <div class="question-title" id="question-text">प्रश्न यहाँ दिखेगा</div>
            <div id="options-container"></div>
        </div>

        <button class="btn" onclick="nextQuestion()" id="next-btn">अगला प्रश्न</button>
    </div>

    <!-- स्टेप 3: सफलता स्क्रीन -->
    <div id="success-screen" class="hidden">
        <div class="success-msg">🎉 आपका टेस्ट सफलतापूर्वक सबमिट हो गया है!</div>
        <p style="text-align: center; color: #636e72;" id="score-display"></p>
        <button class="btn" onclick="goHome()">होम पेज पर वापस जाएं</button>
    </div>

    <!-- स्टेप 4: रिपोर्ट स्क्रीन -->
    <div id="report-screen" class="hidden">
        <h2>📊 छात्रों का पूरा रिकॉर्ड</h2>
        <div style="max-height: 300px; overflow-y: auto;">
            <table id="report-table">
                <tr>
                    <th>नाम</th>
                    <th>मोबाइल</th>
                    <th>प्राप्त अंक</th>
                </tr>
            </table>
        </div>
        <button class="btn" onclick="goHome()" style="margin-top: 20px;">← होम पेज पर वापस जाएं</button>
    </div>
</div>

<script>
    // आपके गूगल फॉर्म वाले बिल्कुल सटीक 10 प्रश्न और उनके विकल्प
    const questions = [
        {
            question: "प्रश्न 1: संख्याओं 26 और 91 का HCF क्या होगा?",
            options: ["(A) 13", "(B) 26", "(C) 7", "(D) 91"],
            answer: 0
        },
        {
            question: "प्रश्न 2: संख्याओं 96 और 404 का HCF कितना होगा?",
            options: ["(A) 2", "(B) 3", "(C) 4", "(D) 8"],
            answer: 2
        },
        {
            question: "प्रश्न 3: अभाज्य गुणनखंड विधि द्वारा 6, 72 और 120 का HCF और LCM ज्ञात कीजिए, HCF क्या होगा?",
            options: ["(A) 3", "(B) 6", "(C) 12", "(D) 2"],
            answer: 1
        },
        {
            question: "प्रश्न 4: यदि HCF (306, 657) = 9 दिया है, तो LCM (306, 657) क्या होगा?",
            options: ["(A) 22338", "(B) 23338", "(C) 21338", "(D) 24338"],
            answer: 0
        },
        {
            question: "प्रश्न 5: जाँच कीजिए कि क्या किसी प्राकृत संख्या n के लिए संख्या 6<sup>n</sup> अंक 0 पर समाप्त हो सकती है?",
            options: ["(A) हाँ", "(B) नहीं", "(C) निश्चित नहीं", "(D) इनमें से कोई नहीं"],
            answer: 1
        },
        {
            question: "प्रश्न 6: व्याख्या कीजिए कि 7 × 11 × 13 + 13 एक भाज्य संख्या क्यों है?",
            options: ["(A) भाज्य संख्या है", "(B) अभाज्य संख्या है", "(C) विषम संख्या है", "(D) सम संख्या है"],
            answer: 0
        },
        {
            question: "प्रश्न 7: किसी खेल के मैदान के चारों ओर एक वृत्ताकार पथ है। इस मैदान का एक चक्कर लगाने में सोनिया को 18 मिनट लगते हैं, जबकि इसी मैदान का एक चक्कर लगाने में रवि को 12 मिनट लगते हैं। वे दोनों एक ही समय पर चलना प्रारम्भ करके एक ही दिशा में चलते हैं। कितने समय बाद वे पुनः प्रारम्भिक स्थान पर मिलेंगे?",
            options: ["(A) 24 मिनट", "(B) 30 मिनट", "(C) 36 मिनट", "(D) 42 मिनट"],
            answer: 2
        },
        {
            question: "प्रश्न 8: सिद्ध कीजिए कि √5 एक अपरिमेय संख्या है। दी गई संख्या √5 किस प्रकार की संख्या है?",
            options: ["(A) परिमेय संख्या", "(B) अपरिमेय संख्या", "(C) पूर्णांक", "(D) प्राकृत संख्या"],
            answer: 1
        },
        {
            question: "प्रश्न 9: निम्नलिखित में से कौन सी एक परिमेय संख्या है?",
            options: ["(A) √2", "(B) √3", "(C) 2", "(D) √5"],
            answer: 2
        },
        {
            question: "प्रश्न 10: यदि दो धनात्मक पूर्णांक a और b को a = x<sup>3</sup>y<sup>2</sup> और b = xy<sup>3</sup> के रूप में लिखा जाए, जहाँ x और y अभाज्य संख्याएँ हैं, तो HCF(a, b) होगा?",
            options: ["(A) xy", "(B) xy<sup>2</sup>", "(C) x<sup>3</sup>y<sup>3</sup>", "(D) x<sup>2</sup>y<sup>2</sup>"],
            answer: 1
        }
    ];

    let currentQuestionIndex = 0;
    let score = 0;
    let studentData = { name: "", mobile: "" };
    let timerInterval;
    let timeLeft = 600;

    window.onload = function() {
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('view') === 'report') {
            showReport();
        }
    };

    function startQuiz() {
        const name = document.getElementById("studentName").value.trim();
        const mobile = document.getElementById("studentMobile").value.trim();

        if (name === "" || mobile === "") {
            alert("कृपया अपना नाम और मोबाइल नंबर दोनों भरें!");
            return;
        }

        studentData.name = name;
        studentData.mobile = mobile;

        document.getElementById("info-screen").classList.add("hidden");
        document.getElementById("quiz-screen").classList.remove("hidden");

        loadQuestion();
        startTimer();
    }

    function loadQuestion() {
        const q = questions[currentQuestionIndex];
        document.getElementById("q-number").innerText = `प्रश्न ${currentQuestionIndex + 1} / ${questions.length}`;
        document.getElementById("question-text").innerHTML = q.question;

        const optionsContainer = document.getElementById("options-container");
        optionsContainer.innerHTML = "";

        q.options.forEach((opt, index) => {
            optionsContainer.innerHTML += `
                <label class="option-label">
                    <input type="radio" name="quiz-option" value="${index}"> ${opt}
                </label>
            `;
        });

        if (currentQuestionIndex === questions.length - 1) {
            document.getElementById("next-btn").innerText = "टेस्ट सबमिट करें";
        }
    }

    function nextQuestion() {
        const selectedOption = document.querySelector('input[name="quiz-option"]:checked');
        if (!selectedOption) {
            alert("कृपया किसी एक विकल्प का चयन करें!");
            return;
        }

        const answerIndex = parseInt(selectedOption.value);
        if (answerIndex === questions[currentQuestionIndex].answer) {
            score++;
        }

        currentQuestionIndex++;

        if (currentQuestionIndex < questions.length) {
            loadQuestion();
        } else {
            submitQuiz();
        }
    }

    function startTimer() {
        timerInterval = setInterval(() => {
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                submitQuiz();
                return;
            }
            timeLeft--;
            let mins = Math.floor(timeLeft / 60);
            let secs = timeLeft % 60;
            document.getElementById("timer").innerText = `समय: ${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }, 1000);
    }

    function submitQuiz() {
        clearInterval(timerInterval);
        
        let results = JSON.parse(localStorage.getItem("quizResults")) || [];
        results.push({ name: studentData.name, mobile: studentData.mobile, score: `${score} / ${questions.length}` });
        localStorage.setItem("quizResults", JSON.stringify(results));

        document.getElementById("quiz-screen").classList.add("hidden");
        document.getElementById("success-screen").classList.remove("hidden");
        document.getElementById("score-display").innerText = `आपने ${questions.length} में से ${score} अंक प्राप्त किए हैं।`;
    }

    function showReport() {
        document.getElementById("info-screen").classList.add("hidden");
        document.getElementById("report-screen").classList.remove("hidden");

        let results = JSON.parse(localStorage.getItem("quizResults")) || [];
        let table = document.getElementById("report-table");

        if (results.length === 0) {
            table.innerHTML += `<tr><td colspan="3" style="color: #636e72;">अभी तक किसी छात्र ने टेस्ट नहीं दिया है।</td></tr>`;
            return;
        }

        results.forEach(res => {
            table.innerHTML += `
                <tr>
                    <td>${res.name}</td>
                    <td>${res.mobile}</td>
                    <td><b>${res.score}</b></td>
                </tr>
            `;
        });
    }

    function goHome() {
        window.location.href = "index.html";
    }
</script>

</body>
</html>
