<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>वीकली टाइमर टेस्ट - गणित</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #74b9ff, #0984e3); 
            margin: 0; 
            padding: 20px; 
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container { 
            width: 100%; 
            max-width: 500px; 
            background: #ffffff; 
            padding: 25px 20px; 
            border-radius: 20px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.2); 
        }
        .header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #f1f2f6;
            padding-bottom: 12px;
            margin-bottom: 20px;
        }
        h1 { 
            color: #2d3436; 
            font-size: 20px; 
            margin: 0; 
        }
        /* टाइमर बॉक्स का डिज़ाइन */
        #timer {
            background: #d63031;
            color: white;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
        }
        .question-box {
            font-size: 16px;
            color: #2d3436;
            margin-bottom: 15px;
            font-weight: bold;
        }
        .option-item {
            display: block;
            width: 100%;
            padding: 10px 15px;
            margin: 8px 0;
            background: #f1f2f6;
            border: 2px solid #dfe6e9;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
            text-align: left;
            transition: 0.2s;
        }
        .option-item:hover {
            background: #dfe6e9;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background: #0984e3;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn:hover {
            background: #074b83;
        }
        .back-btn { 
            display: block;
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            background: #636e72; 
            color: white; 
            border-radius: 10px; 
            text-decoration: none; 
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container" id="app">
    <div class="header-flex">
        <h1>⚡ वीकली टेस्ट</h1>
        <div id="timer">समय: <span id="time-left">10:00</span></div>
    </div>

    <!-- टेस्ट का कंटेंट यहाँ लोड होगा -->
    <div id="test-content">
        <div class="question-box">प्रश्नों को लोड किया जा रहा है...</div>
    </div>

    <a href="index.html" class="back-btn">← होम पेज पर वापस जाएं</a>
</div>

<script>
    // टाइमर चालू करने का कोड (10 मिनट का टेस्ट)
    let totalSeconds = 10 * 60;
    const timerDisplay = document.getElementById('time-left');

    function startTimer() {
        const interval = setInterval(() => {
            let minutes = Math.floor(totalSeconds / 60);
            let seconds = totalSeconds % 60;

            minutes = minutes < 10 ? '0' + minutes : minutes;
            seconds = seconds < 10 ? '0' + seconds : seconds;

            timerDisplay.textContent = `${minutes}:${seconds}`;

            if (totalSeconds > 0) {
                totalSeconds--;
            } else {
                clearInterval(interval);
                alert("समय समाप्त हो गया है!");
                // चाहें तो यहाँ ऑटो-सबमिट का कोड लिख सकते हैं
            }
        }, 1000);
    }

    // पेज खुलते ही टाइमर शुरू हो जाएगा
    startTimer();
</script>

</body>
</html>
