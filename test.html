<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>वीकली टाइमर टेस्ट - गणित</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #74b9ff, #0984e3); 
            margin: 0; 
            padding: 20px; 
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container { 
            width: 100%; 
            max-width: 500px; 
            background: #ffffff; 
            padding: 25px 20px; 
            border-radius: 20px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.2); 
            max-height: 90vh;
            overflow-y: auto;
        }
        .header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #f1f2f6;
            padding-bottom: 12px;
            margin-bottom: 20px;
        }
        h1 { 
            color: #2d3436; 
            font-size: 20px; 
            margin: 0; 
        }
        #timer {
            background: #d63031;
            color: white;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
        }
        .question-box {
            font-size: 16px;
            color: #2d3436;
            margin-bottom: 15px;
            font-weight: bold;
        }
        .option-item {
            display: block;
            width: 100%;
            padding: 10px 15px;
            margin: 8px 0;
            background: #f1f2f6;
            border: 2px solid #dfe6e9;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
            text-align: left;
            transition: 0.2s;
        }
        .option-item:hover {
            background: #dfe6e9;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background: #0984e3;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn:hover {
            background: #074b83;
        }
        .back-btn { 
            display: block;
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            background: #636e72; 
            color: white; 
            border-radius: 10px; 
            text-decoration: none; 
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container" id="app">
    <div class="header-flex">
        <h1>⚡ वीकली टेस्ट</h1>
        <div id="timer">समय: <span id="time-left">10:00</span></div>
    </div>

    <!-- टेस्ट के प्रश्न -->
    <div id="test-content">
        <div class="question-box">प्रश्‍न 1: संख्याओं 26 और 91 का HCF क्या होगा?</div>
        <label class="option-item"><input type="radio" name="q1" value="A"> (A) 13</label>
        <label class="option-item"><input type="radio" name="q1" value="B"> (B) 26</label>
        <label class="option-item"><input type="radio" name="q1" value="C"> (C) 7</label>
        <label class="option-item"><input type="radio" name="q1" value="D"> (D) 91</label>

        <button class="btn" onclick="submitTest()">टेस्ट सबमिट करें</button>
    </div>

    <a href="index.html" class="back-btn">← होम पेज पर वापस जाएं</a>
</div>

<script>
    // 10 मिनट का टाइमर
    let totalSeconds = 10 * 60;
    const timerDisplay = document.getElementById('time-left');

    function startTimer() {
        const interval = setInterval(() => {
            let minutes = Math.floor(totalSeconds / 60);
            let seconds = totalSeconds % 60;

            minutes = minutes < 10 ? '0' + minutes : minutes;
            seconds = seconds < 10 ? '0' + seconds : seconds;

            timerDisplay.textContent = `${minutes}:${seconds}`;

            if (totalSeconds > 0) {
                totalSeconds--;
            } else {
                clearInterval(interval);
                alert("समय समाप्त हो गया है!");
            }
        }, 1000);
    }

    startTimer();

    function submitTest() {
        alert("आपका टेस्ट सफलतापूर्वक सबमिट हो गया है!");
        window.location.href = "index.html";
    }
</script>

</body>
</html>
