<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>गणित वीकली टेस्ट - अध्याय 1</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: sans-serif;
            background: linear-gradient(135deg, #74b9ff, #0984e3);
            margin: 0; padding: 20px; min-height: 100vh;
            display: flex; justify-content: center; align-items: center;
        }
        .container {
            width: 100%; max-width: 500px; background: #fff; padding: 25px;
            border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        .btn {
            width: 100%; background: #0984e3; color: white; border: none;
            padding: 14px; border-radius: 12px; font-size: 16px; font-weight: bold;
            cursor: pointer; margin-top: 10px;
        }
        .btn:hover { background: #0878cc; }
        .hidden { display: none; }
        input[type="text"], input[type="tel"] {
            width: 100%; padding: 12px; margin: 8px 0 15px 0;
            border: 2px solid #dfe6e9; border-radius: 10px; font-size: 16px;
        }
        .option-label {
            display: block; background: #f8f9fa; border: 2px solid #e9ecef;
            padding: 12px; margin: 8px 0; border-radius: 10px; cursor: pointer;
        }
        .option-label:hover { background: #eaf4ff; border-color: #74b9ff; }
        #question-text { font-size: 18px; line-height: 1.6; margin: 15px 0; }
        .result-box {
            text-align: center; margin-top: 20px; padding: 20px;
            background: #f8f9fa; border-radius: 15px;
        }
        .score { font-size: 26px; font-weight: bold; color: #0984e3; margin-bottom: 15px; }
        .result-row { font-size: 16px; color: #2d3436; margin: 8px 0; }
    </style>
</head>
<body>
<div class="container" id="app">

    <div id="info-screen">
        <h2>⚡ गणित साप्ताहिक टेस्ट - अध्याय 1</h2>
        <label><b>नाम:</b></label>
        <input type="text" id="studentName" placeholder="अपना नाम लिखें">

        <label><b>मोबाइल:</b></label>
        <input type="tel" id="studentMobile" maxlength="10" inputmode="numeric"
               placeholder="10 अंकों का मोबाइल नंबर">

        <button class="btn" onclick="startQuiz()">टेस्ट शुरू करें</button>
    </div>

    <div id="quiz-screen" class="hidden">
        <h2 id="q-number">प्रश्न 1</h2>
        <div id="question-text"></div>
        <div id="options-container"></div>
        <button class="btn" onclick="nextQuestion()" id="next-btn">अगला प्रश्न</button>
    </div>

    <div id="success-screen" class="hidden">
        <div style="text-align:center; font-size:20px; font-weight:bold;">
            🎉 टेस्ट सबमिट हो गया!
        </div>
        <div class="result-box">
            <div class="score" id="final-score">आपका स्कोर: 0/10</div>
            <div class="result-row">📅 <b>तारीख:</b> <span id="final-date"></span></div>
            <div class="result-row">🕐 <b>समय:</b> <span id="final-time"></span></div>
        </div>
        <button class="btn" onclick="window.location.href='index.html'">
            होम पेज पर जाएं
        </button>
    </div>
</div>

<script>
const questions = [
    { q: "संख्याओं 26 और 91 का HCF क्या होगा?", o: ["13", "26", "7", "91"], a: 0 },
    { q: "संख्याओं 96 और 404 का HCF कितना होगा?", o: ["2", "3", "4", "8"], a: 2 },
    { q: "6, 72 और 120 का HCF क्या होगा?", o: ["3", "6", "12", "2"], a: 1 },
    { q: "यदि HCF(306, 657) = 9 है, तो LCM क्या होगा?", o: ["22338", "23338", "21338", "24338"], a: 0 },
    { q: "क्या 6<sup>n</sup> अंक 0 पर समाप्त हो सकता है?", o: ["हाँ", "नहीं", "निश्चित नहीं", "इनमें से कोई नहीं"], a: 1 },
    { q: "7 × 11 × 13 + 13 एक कैसी संख्या है?", o: ["भाज्य", "अभाज्य", "विषम", "सम"], a: 0 },
    { q: "सोनिया (18 मिनट) और रवि (12 मिनट) पुनः कब मिलेंगे?", o: ["24 मिनट", "30 मिनट", "36 मिनट", "42 मिनट"], a: 2 },
    { q: "√5 किस प्रकार की संख्या है?", o: ["परिमेय", "अपरिमेय", "पूर्णांक", "प्राकृत"], a: 1 },
    { q: "निम्नलिखित में से कौन सी एक परिमेय संख्या है?", o: ["√2", "√3", "2", "√5"], a: 2 },
    {
        q: "HCF(a, b) होगा यदि a = x<sup>3</sup>y<sup>2</sup> और b = xy<sup>3</sup>?",
        o: ["xy", "xy<sup>2</sup>", "x<sup>3</sup>y<sup>3</sup>", "x<sup>2</sup>y<sup>2</sup>"],
        a: 1
    }
];

let currentQ = 0, score = 0, sName = "", sMob = "";

function startQuiz() {
    sName = document.getElementById("studentName").value.trim();
    sMob = document.getElementById("studentMobile").value.trim();

    if (!sName) {
        alert("कृपया अपना नाम लिखें!");
        return;
    }
    if (!/^[0-9]{10}$/.test(sMob)) {
        alert("कृपया अपना 10 अंकों का सही मोबाइल नंबर लिखें!");
        return;
    }

    currentQ = 0;
    score = 0;
    document.getElementById("info-screen").classList.add("hidden");
    document.getElementById("quiz-screen").classList.remove("hidden");
    loadQ();
}

function loadQ() {
    let q = questions[currentQ];

    document.getElementById("q-number").innerText = "प्रश्न " + (currentQ + 1);
    document.getElementById("question-text").innerHTML = q.q;

    let html = "";
    q.o.forEach(function(opt, i) {
        html += `
            <label class="option-label">
                <input type="radio" name="r" value="${i}">
                ${opt}
            </label>
        `;
    });
    document.getElementById("options-container").innerHTML = html;

    document.getElementById("next-btn").innerText =
        currentQ === questions.length - 1 ? "टेस्ट सबमिट करें" : "अगला प्रश्न";
}

function nextQuestion() {
    let val = document.querySelector('input[name="r"]:checked');

    if (!val) {
        alert("कृपया कोई विकल्प चुनें!");
        return;
    }

    if (parseInt(val.value) === questions[currentQ].a) score++;
    currentQ++;

    if (currentQ < questions.length) {
        loadQ();
    } else {
        submitQuiz();
    }
}

function submitQuiz() {
    let now = new Date();

    let day = String(now.getDate()).padStart(2, "0");
    let month = String(now.getMonth() + 1).padStart(2, "0");
    let year = now.getFullYear();
    let dateStr = `${day}/${month}/${year}`;

    let hours = now.getHours();
    let minutes = String(now.getMinutes()).padStart(2, "0");
    let ampm = hours >= 12 ? "PM" : "AM";
    hours = hours % 12;
    hours = hours ? hours : 12;
    let timeStr = `${String(hours).padStart(2, "0")}:${minutes} ${ampm}`;

    let finalScoreText = score + "/10";

    document.getElementById("quiz-screen").classList.add("hidden");
    document.getElementById("success-screen").classList.remove("hidden");

    document.getElementById("final-score").innerText =
        "आपका स्कोर: " + finalScoreText;
    document.getElementById("final-date").innerText = dateStr;
    document.getElementById("final-time").innerText = timeStr;

    // नया Google Apps Script Web App लिंक
    fetch(
        "https://script.google.com/macros/s/AKfycbyM6xnzjjpQLVP-mS-j1KdVVEHf6Rv8EV-MClYHi8NCjmKqADqBk64OPTxZ6JSN7DkTBA/exec",
        {
            method: "POST",
            mode: "no-cors",
            body: new URLSearchParams({
                name: sName,
                mobile: sMob,
                score: finalScoreText
            })
        }
    );

    currentQ = 0;
    score = 0;
}
</script>
</body>
</html>
