<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>वीकली टाइमर टेस्ट - अध्याय 1: वास्तविक संख्याएँ</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #74b9ff, #0984e3); 
            margin: 0; 
            padding: 20px; 
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container { 
            width: 100%; 
            max-width: 500px; 
            background: #ffffff; 
            padding: 25px 20px; 
            border-radius: 20px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.2); 
            max-height: 90vh;
            overflow-y: auto;
        }
        .header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #f1f2f6;
            padding-bottom: 12px;
            margin-bottom: 20px;
        }
        h1 { 
            color: #2d3436; 
            font-size: 18px; 
            margin: 0; 
        }
        #timer {
            background: #d63031;
            color: white;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
        }
        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }
        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            color: #2d3436;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 2px solid #dfe6e9;
            border-radius: 10px;
            font-size: 15px;
        }
        .question-box {
            font-size: 16px;
            color: #2d3436;
            margin-bottom: 15px;
            font-weight: bold;
            text-align: left;
            line-height: 1.5;
        }
        .option-item {
            display: block;
            width: 100%;
            padding: 10px 15px;
            margin: 8px 0;
            background: #f1f2f6;
            border: 2px solid #dfe6e9;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
            text-align: left;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background: #0984e3;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn:hover { background: #074b83; }
        .record-card {
            background: #f1f2f6;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            text-align: left;
            border-left: 5px solid #0984e3;
            font-size: 14px;
            color: #2d3436;
        }
        .back-btn { 
            display: block;
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            background: #636e72; 
            color: white; 
            border-radius: 10px; 
            text-decoration: none; 
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container" id="app">
    <div class="header-flex">
        <h1 id="page-title">⚡ अध्याय 1 टेस्ट</h1>
        <div id="timer" style="display:none;">समय: <span id="time-left">10:00</span></div>
    </div>

    <!-- 1. लॉगिन सेक्शन -->
    <div id="login-section">
        <div class="form-group">
            <label>छात्र का पूरा नाम:</label>
            <input type="text" id="student-name" placeholder="अपना नाम लिखें">
        </div>
        <div class="form-group">
            <label>मोबाइल नंबर:</label>
            <input type="tel" id="student-phone" placeholder="अपना मोबाइल नंबर लिखें">
        </div>
        <button class="btn" onclick="startTest()">टेस्ट शुरू करें</button>
    </div>

    <!-- 2. क्विज़ सेक्शन -->
    <div id="quiz-section" style="display:none;">
        <div id="question-container"></div>
        <button class="btn" id="next-btn" onclick="nextQuestion()">अगला प्रश्न</button>
    </div>

    <!-- 3. रिकॉर्ड सेक्शन -->
    <div id="report-section" style="display:none;">
        <div id="records-list"></div>
        <button class="btn" style="background:#d63031; margin-top:10px;" onclick="clearRecords()">सारा रिकॉर्ड डिलीट करें</button>
    </div>

    <a href="index.html" class="back-btn">← होम पेज पर वापस जाएं</a>
</div>

<script>
    // केवल अध्याय 1 (वास्तविक संख्याएँ) के 10 महत्वपूर्ण प्रश्न (सुपरस्क्रिप्ट ठीक किए गए)
    const questions = [
        { q: "प्रश्न 1: संख्याओं 26 और 91 का HCF क्या होगा?", options: ["(A) 13", "(B) 26", "(C) 7", "(D) 91"], answer: 0 },
        { q: "प्रश्न 2: संख्याओं 96 और 404 का HCF कितना होगा?", options: ["(A) 2", "(B) 3", "(C) 4", "(D) 8"], answer: 2 },
        { q: "प्रश्न 3: किसी पूर्णांक q के लिए, प्रत्येक विषम पूर्णांक का रूप होता है?", options: ["(A) 2q", "(B) 2q + 1", "(C) q", "(D) q + 1"], answer: 1 },
        { q: "प्रश्न 4: किसी पूर्णांक m के लिए, प्रत्येक सम पूर्णांक का रूप होता है?", options: ["(A) m", "(B) m + 1", "(C) 2m", "(D) 2m + 1"], answer: 2 },
        { q: "प्रश्न 5: संख्या 140 को अभाज्य गुणनखंडों के गुणनफल के रूप में लिखा जा सकता है?", options: ["(A) 2 × 2 × 5 × 7", "(B) 2 × 5 × 5 × 7", "(C) 2 × 2 × 2 × 7", "(D) 5 × 5 × 7 × 7"], answer: 0 },
        { q: "प्रश्न 6: 6 और 20 का HCF और LCM का गुणनफल क्या होगा?", options: ["(A) 120", "(B) 26", "(C) 14", "(D) 240"], answer: 0 },
        { q: "प्रश्न 7: यदि HCF (306, 657) = 9 दिया है, तो LCM (306, 657) ज्ञात कीजिए?", options: ["(A) 22338", "(B) 22328", "(C) 22358", "(D) 22438"], answer: 0 },
        { q: "प्रश्न 8: निम्नलिखित में से कौन सी एक अभाज्य संख्या है?", options: ["(A) 8", "(B) 9", "(C) 11", "(D) 15"], answer: 2 },
        { q: "प्रश्न 9: 3.1416 एक संख्या है?", options: ["(A) एक परिमेय संख्या", "(B) एक अपरिमेय संख्या", "(C) एक पूर्णांक", "(D) इनमें से कोई नहीं"], answer: 0 },
        { q: "प्रश्न 10: यदि दो धनात्मक पूर्णांक a और b को a = x<sup>3</sup>y<sup>2</sup> और b = xy<sup>3</sup> के रूप में लिखा जाए, जहाँ x और y अभाज्य संख्याएँ हैं, तो HCF(a, b) होगा?", options: ["(A) xy", "(B) xy<sup>2</sup>", "(C) x<sup>3</sup>y<sup>3</sup>", "(D) x<sup>2</sup>y<sup>2</sup>"], answer: 1 }
    ];

    let currentQuestion = 0;
    let score = 0;
    let studentName = "";
    let studentPhone = "";
    let totalSeconds = 10 * 60;
    let timerInterval;

    const urlParams = new URLSearchParams(window.location.search);
    if(urlParams.get('view') === 'report') {
        document.getElementById('login-section').style.display = 'none';
        document.getElementById('quiz-section').style.display = 'none';
        document.getElementById('report-section').style.display = 'block';
        document.getElementById('page-title').textContent = '📊 छात्रों का रिकॉर्ड';
        document.getElementById('timer').style.display = 'none';
        displayRecords();
    }

    function startTimer() {
        document.getElementById('timer').style.display = 'block';
        timerInterval = setInterval(() => {
            let minutes = Math.floor(totalSeconds / 60);
            let seconds = totalSeconds % 60;
            minutes = minutes < 10 ? '0' + minutes : minutes;
            seconds = seconds < 10 ? '0' + seconds : seconds;
            document.getElementById('time-left').textContent = `${minutes}:${seconds}`;

            if (totalSeconds > 0) {
                totalSeconds--;
            } else {
                clearInterval(timerInterval);
                alert("समय समाप्त हो गया है!");
                submitTest();
            }
        }, 1000);
    }

    function startTest() {
        studentName = document.getElementById('student-name').value.trim();
        studentPhone = document.getElementById('student-phone').value.trim();

        if(studentName === '' || studentPhone === '') {
            alert('कृपया अपना नाम और मोबाइल नंबर दोनों दर्ज करें!');
            return;
        }

        document.getElementById('login-section').style.display = 'none';
        document.getElementById('quiz-section').style.display = 'block';
        startTimer();
        loadQuestion();
    }

    function loadQuestion() {
        if (currentQuestion < questions.length) {
            let q = questions[currentQuestion];
            let html = `<div class="question-box">${q.q}</div>`;
            q.options.forEach((opt, index) => {
                html += `<label class="option-item"><input type="radio" name="quiz_opt" value="${index}"> ${opt}</label>`;
            });
            document.getElementById('question-container').innerHTML = html;
            
            if(currentQuestion === questions.length - 1) {
                document.getElementById('next-btn').textContent = "टेस्ट सबमिट करें";
            }
        }
    }

    function nextQuestion() {
        let selected = document.querySelector('input[name="quiz_opt"]:checked');
        if (!selected) {
            alert("कृपया किसी एक विकल्प का चयन करें!");
            return;
        }

        let answer = parseInt(selected.value);
        if (answer === questions[currentQuestion].answer) {
            score++;
        }

        currentQuestion++;
        if (currentQuestion < questions.length) {
            loadQuestion();
        } else {
            submitTest();
        }
    }

    function submitTest() {
        clearInterval(timerInterval);
        
        let records = JSON.parse(localStorage.getItem('student_test_records') || '[]');
        let dateObj = new Date();
        let dateTime = dateObj.toLocaleDateString() + ' ' + dateObj.toLocaleTimeString();
        
        records.push({
            name: studentName,
            phone: studentPhone,
            score: score,
            total: questions.length,
            time: dateTime
        });
        
        localStorage.setItem('student_test_records', JSON.stringify(records));

        alert(`टेस्ट समाप्त! आपके ${score}/${questions.length} अंक आए हैं।`);
        window.location.href = "index.html";
    }

    function displayRecords() {
        let records = JSON.parse(localStorage.getItem('student_test_records') || '[]');
        let container = document.getElementById('records-list');
        
        if (records.length === 0) {
            container.innerHTML = `<div class="record-card">अभी तक किसी भी छात्र ने टेस्ट नहीं दिया है।</div>`;
            return;
        }

        let html = "";
        records.forEach((rec, index) => {
            html += `<div class="record-card">
                <b>${index + 1}. नाम:</b> ${rec.name}<br>
                <b>मोबाइल:</b> ${rec.phone}<br>
                <b>स्कोर:</b> ${rec.score} / ${rec.total}<br>
                <small style="color: #636e72;">दिनांक: ${rec.time}</small>
            </div>`;
        });
        container.innerHTML = html;
    }

    function clearRecords() {
        if(confirm("क्या आप सारे रिकॉर्ड डिलीट करना चाहते हैं?")) {
            localStorage.removeItem('student_test_records');
            displayRecords();
        }
    }
</script>

</body>
</html>
