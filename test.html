<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>वीकली टाइमर टेस्ट - गणित</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #74b9ff, #0984e3); 
            margin: 0; 
            padding: 20px; 
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container { 
            width: 100%; 
            max-width: 500px; 
            background: #ffffff; 
            padding: 25px 20px; 
            border-radius: 20px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.2); 
            max-height: 90vh;
            overflow-y: auto;
        }
        .header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #f1f2f6;
            padding-bottom: 12px;
            margin-bottom: 20px;
        }
        h1 { 
            color: #2d3436; 
            font-size: 20px; 
            margin: 0; 
        }
        #timer {
            background: #d63031;
            color: white;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
        }
        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }
        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            color: #2d3436;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 2px solid #dfe6e9;
            border-radius: 10px;
            font-size: 15px;
        }
        .question-box {
            font-size: 16px;
            color: #2d3436;
            margin-bottom: 15px;
            font-weight: bold;
            text-align: left;
        }
        .option-item {
            display: block;
            width: 100%;
            padding: 10px 15px;
            margin: 8px 0;
            background: #f1f2f6;
            border: 2px solid #dfe6e9;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
            text-align: left;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background: #0984e3;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .back-btn { 
            display: block;
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            background: #636e72; 
            color: white; 
            border-radius: 10px; 
            text-decoration: none; 
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container" id="app">
    <div class="header-flex">
        <h1 id="page-title">⚡ वीकली टेस्ट</h1>
        <div id="timer" style="display:none;">समय: <span id="time-left">10:00</span></div>
    </div>

    <!-- 1. छात्र का नाम और मोबाइल नंबर दर्ज करने का फॉर्म -->
    <div id="login-section">
        <div class="form-group">
            <label>छात्र का पूरा नाम:</label>
            <input type="text" id="student-name" placeholder="अपना नाम लिखें">
        </div>
        <div class="form-group">
            <label>मोबाइल नंबर:</label>
            <input type="tel" id="student-phone" placeholder="अपना मोबाइल नंबर लिखें">
        </div>
        <button class="btn" onclick="startTest()">टेस्ट शुरू करें</button>
    </div>

    <!-- 2. टेस्ट के प्रश्न (शुरुआत में छिपे रहेंगे) -->
    <div id="quiz-section" style="display:none;">
        <div class="question-box">प्रश्‍न 1: संख्याओं 26 और 91 का HCF क्या होगा?</div>
        <label class="option-item"><input type="radio" name="q1" value="A"> (A) 13</label>
        <label class="option-item"><input type="radio" name="q1" value="B"> (B) 26</label>
        <label class="option-item"><input type="radio" name="q1" value="C"> (C) 7</label>
        <label class="option-item"><input type="radio" name="q1" value="D"> (D) 91</label>

        <button class="btn" onclick="submitTest()">टेस्ट सबमिट करें</button>
    </div>

    <!-- 3. रिपोर्ट सेक्शन (जब होम पेज से रिकॉर्ड देखना हो) -->
    <div id="report-section" style="display:none;">
        <p>यहाँ सभी छात्रों का रिकॉर्ड दिखाई देगा।</p>
    </div>

    <a href="index.html" class="back-btn">← होम पेज पर वापस जाएं</a>
</div>

<script>
    // चेक करें कि क्या यूजर ने रिपोर्ट देखने के लिए क्लिक किया है
    const urlParams = new URLSearchParams(window.location.search);
    if(urlParams.get('view') === 'report') {
        document.getElementById('login-section').style.display = 'none';
        document.getElementById('report-section').style.display = 'block';
        document.getElementById('page-title').textContent = '📊 छात्रों का रिकॉर्ड';
    }

    let totalSeconds = 10 * 60;
    let timerInterval;

    function startTimer() {
        document.getElementById('timer').style.display = 'block';
        timerInterval = setInterval(() => {
            let minutes = Math.floor(totalSeconds / 60);
            let seconds = totalSeconds % 60;
            minutes = minutes < 10 ? '0' + minutes : minutes;
            seconds = seconds < 10 ? '0' + seconds : seconds;
            document.getElementById('time-left').textContent = `${minutes}:${seconds}`;

            if (totalSeconds > 0) {
                totalSeconds--;
            } else {
                clearInterval(timerInterval);
                alert("समय समाप्त हो गया है!");
                submitTest();
            }
        }, 1000);
    }

    function startTest() {
        let name = document.getElementById('student-name').value.trim();
        let phone = document.getElementById('student-phone').value.trim();

        if(name === '' || phone === '') {
            alert('कृपया अपना नाम और मोबाइल नंबर दोनों दर्ज करें!');
            return;
        }

        // नाम-नंबर छिपाकर टेस्ट और टाइमर शुरू करें
        document.getElementById('login-section').style.display = 'none';
        document.getElementById('quiz-section').style.display = 'block';
        startTimer();
    }

    function submitTest() {
        clearInterval(timerInterval);
        alert("आपका टेस्ट सफलतापूर्वक सबमिट हो गया है!");
        window.location.href = "index.html";
    }
</script>

</body>
</html>
