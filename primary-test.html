<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<!-- Edge-to-Edge Mobile App Viewport Settings -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#102a56">
<title>MP TET 2026 | 90 Days CBT Portal</title>
<style>
:root{--blue:#155eef;--dark:#102a56;--green:#12a150;--red:#d92d20;--border:#dce3ee}
*{box-sizing:border-box}

/* Zero Margin Edge-to-Edge Body */
html, body{
  margin:0 !important;
  padding:0 !important;
  width:100vw;
  min-height:100vh;
  min-height:-webkit-fill-available;
  background:#eef3f9;
  color:#172033;
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  overflow-x:hidden;
  -webkit-tap-highlight-color:transparent;
}

.top{
  background:linear-gradient(135deg,#102a56,#1d5fd1);
  color:#fff;
  padding:calc(12px + env(safe-area-inset-top)) 16px 12px;
  position:sticky;
  top:0;
  z-index:100;
  box-shadow:0 4px 16px rgba(0,0,0,0.15);
  width:100%;
}
.topin{max-width:1150px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand{font-weight:900;font-size:16px}
.timer{background:#fff;color:#c62828;padding:6px 12px;border-radius:8px;font-weight:900;font-size:13px}
.btn-top{background:rgba(255,255,255,0.2);color:#fff;border:1px solid rgba(255,255,255,0.4);border-radius:8px;padding:6px 10px;font-weight:bold;cursor:pointer;font-size:12px}

.wrap{
  max-width:1150px;
  margin:10px auto;
  padding:0 10px calc(14px + env(safe-area-inset-bottom));
  width:100%;
}
.date-bar{background:#fff;border-radius:12px;padding:12px 16px;box-shadow:0 3px 12px rgba(0,0,0,0.05);margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.date-bar select{padding:8px 12px;border:1.5px solid #cbd5e1;border-radius:8px;font-size:13px;font-weight:bold;color:#1e293b;outline:none;background:#fff;cursor:pointer}
.day-tag{background:#edf4ff;color:#155eef;padding:6px 12px;border-radius:15px;font-size:12px;font-weight:bold}

.sec-tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;padding-bottom:4px}
.sec-tab{background:#fff;border:1.5px solid #cbd5e1;border-radius:8px;padding:8px 12px;font-size:12px;font-weight:bold;cursor:pointer;white-space:nowrap;transition:0.2s}
.sec-tab.active{background:#155eef;color:#fff;border-color:#155eef}

.lang-selector-box{background:#f0f9ff;border:1px solid #b9e6fe;padding:8px 12px;border-radius:8px;display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:13px;font-weight:bold;color:#026aa2}
.lang-selector-box select{padding:5px 10px;border-radius:6px;border:1px solid #7cd4fd;font-weight:bold;color:#026aa2;background:#fff;cursor:pointer}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:10px}
.paper,.palette{background:#fff;border-radius:12px;box-shadow:0 3px 12px rgba(0,0,0,0.05);padding:16px}
.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.qno{font-weight:900;color:#155eef;font-size:14px}
.mark{border:1px solid #d0d5dd;background:#fff;border-radius:6px;padding:6px 10px;font-size:11px;font-weight:bold;cursor:pointer}
.sub-indicator{background:#eef4ff;color:#155eef;padding:4px 8px;border-radius:5px;font-size:11px;font-weight:bold;margin-bottom:8px;display:inline-block}
.question{font-size:16px;line-height:1.5;font-weight:700;margin:10px 0 14px}

.option{display:flex;align-items:flex-start;gap:10px;border:1.5px solid var(--border);padding:11px;border-radius:8px;margin:7px 0;cursor:pointer;background:#fff;transition:0.15s}
.option:hover{border-color:#8bb3ff;background:#f8fbff}
.option.correct-opt{border-color:var(--green) !important;background:#e9f8ef !important;color:#0e7a3d !important;font-weight:bold}
.option.wrong-opt{border-color:var(--red) !important;background:#fef3f2 !important;color:#b42318 !important;font-weight:bold}

.instant-exp{margin-top:12px;padding:12px;border-radius:8px;background:#f0f9ff;border-left:4px solid #155eef;font-size:12.5px;line-height:1.45;color:#1e40af}

.nav{display:flex;justify-content:space-between;gap:8px;margin-top:16px;border-top:1px solid #edf0f5;padding-top:12px}
.btn{border:0;border-radius:8px;padding:9px 14px;font-weight:bold;cursor:pointer;font-size:13px}
.prev{background:#eef2f7}.next{background:#155eef;color:#fff}.submit{background:#12a150;color:#fff}

.palette{padding:14px;height:max-content}
.palette h3{margin:0 0 8px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;max-height:340px;overflow-y:auto;padding-right:2px}
.num{border:1px solid #d7dee9;background:#fff;border-radius:5px;height:28px;font-weight:bold;font-size:10px;cursor:pointer}
.num.current{border:2px solid #155eef;color:#155eef}
.num.answered{background:#e9f8ef;border-color:#7bd3a0}
.num.review{background:#fff4d6;border-color:#f3b93f}

.lock-screen{display:none;background:#fff;border-radius:12px;padding:45px 20px;text-align:center;box-shadow:0 3px 12px rgba(0,0,0,0.05)}
.result{display:none;background:#fff;border-radius:12px;padding:20px;box-shadow:0 3px 12px rgba(0,0,0,0.05)}
.score{font-size:30px;font-weight:950;color:#155eef}
.reviewcard{border:1px solid #e3e8f0;border-radius:8px;padding:10px;margin:8px 0;font-size:13px}
.correct{border-left:4px solid var(--green)}.wrong{border-left:4px solid var(--red)}

@media(max-width:768px){
  .layout{grid-template-columns:1fr}
  .wrap{padding:0 6px calc(14px + env(safe-area-inset-bottom))}
}
</style>
</head>
<body>
<header class="top">
  <div class="topin">
    <div class="brand">MP TET 2026 • 90 Days Daily Portal</div>
    <div style="display:flex;align-items:center;gap:8px">
      <button class="btn-top" id="soundBtn" onclick="toggleSound()"> Sound: ON</button>
      <div class="timer" id="timer">150:00</div>
    </div>
  </div>
</header>
<main class="wrap">
  <section class="date-bar">
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
      <label style="font-weight:bold;font-size:13px">📅 दिनांक चुनें (DD/MM/YYYY):</label>
      <select id="daySelect" onchange="onSelectChange()"></select>
      <button class="btn prev" onclick="loadLatestActiveDay()" style="padding:6px 10px;font-size:12px">⚡ आज का टेस्ट</button>
    </div>
    <div>
      <span class="day-tag" id="dayDisplay">Day 1</span>
    </div>
  </section>

  <!-- Section Quick Switch Tabs -->
  <div class="sec-tabs">
    <button class="sec-tab active" id="tab0" onclick="jumpToQuestion(0)">भाग 1: CDP (1-30)</button>
    <button class="sec-tab" id="tab1" onclick="jumpToQuestion(30)">भाग 2: हिन्दी (31-60)</button>
    <button class="sec-tab" id="tab2" onclick="jumpToQuestion(60)">भाग 3: भाषा-2 (61-90)</button>
    <button class="sec-tab" id="tab3" onclick="jumpToQuestion(90)">भाग 4: गणित (91-120)</button>
    <button class="sec-tab" id="tab4" onclick="jumpToQuestion(120)">भाग 5: EVS (121-150)</button>
  </div>

  <section id="lockScreen" class="lock-screen">
    <div style="font-size:48px">🔒</div>
    <h2 id="lockTitle" style="color:#d92d20;margin:10px 0 6px">यह टेस्ट अभी लॉक है!</h2>
    <p id="lockMsg" style="color:#64748b;font-size:13.5px;max-width:500px;margin:auto;line-height:1.5">
      यह आगामी तिथि का टेस्ट है और निर्धारित दिनांक आने पर ही खुलेगा।
    </p>
    <button class="btn next" style="margin-top:14px" onclick="loadLatestActiveDay()">⚡ उपलब्ध टेस्ट पर जाएँ</button>
  </section>

  <section id="testArea" class="layout">
    <div class="paper">
      <div class="lang-selector-box" id="lang2SelectBox" style="display:none">
        <span>🌐 द्वितीय भाषा (Language-II) बदलें:</span>
        <select id="lang2Choice" onchange="changeLanguage2()">
          <option value="english">English (अंग्रेजी)</option>
          <option value="sanskrit">संस्कृत (Sanskrit)</option>
          <option value="hindi2">हिन्दी (Hindi-II)</option>
        </select>
      </div>
      <div class="qhead">
        <span class="qno" id="qno">प्रश्न 1 / 150</span>
        <button class="mark" onclick="toggleReview()">⚑ Review</button>
      </div>
      <div class="sub-indicator" id="subIndicator">भाग 1: बाल विकास एवं शिक्षाशास्त्र</div>
      <div class="question" id="question">लोड हो रहा है...</div>
      <div id="options"></div>
      <div id="instantExplanation"></div>
      <div class="nav">
        <button class="btn prev" onclick="prevQ()">← पिछला</button>
        <button class="btn next" onclick="nextQ()">अगला →</button>
      </div>
    </div>
    <aside class="palette">
      <h3>Question Palette</h3>
      <div class="grid" id="palette"></div>
      <button class="btn submit" style="width:100%;margin-top:12px" onclick="submitTest()">✓ Test Submit करें</button>
    </aside>
  </section>

  <section id="result" class="result">
    <h1>🎯 परीक्षा परिणाम</h1>
    <p><span class="score" id="score">0/150</span></p>
    <p id="percent"></p><p id="summary"></p>
    <div id="review"></div>
    <button class="btn next" style="width:100%;margin-top:12px" onclick="location.reload()">↻ फिर से टेस्ट दें</button>
  </section>
</main>

<script>
var soundEnabled = true;
function playBeep(isGood) {
  if (!soundEnabled) return;
  try {
    var ctx = new (window.AudioContext || window.webkitAudioContext)();
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.type = isGood ? 'sine' : 'sawtooth';
    osc.frequency.setValueAtTime(isGood ? 650 : 140, ctx.currentTime);
    if (isGood) osc.frequency.setValueAtTime(880, ctx.currentTime + 0.08);
    gain.gain.setValueAtTime(0.2, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.3);
  } catch(e) {}
}
function toggleSound() {
  soundEnabled = !soundEnabled;
  document.getElementById('soundBtn').textContent = soundEnabled ? '🔊 Sound: ON' : '🔇 Sound: OFF';
}

// Fixed Start Date: 18 August 2026
var startDate = new Date(2026, 7, 18); // Month is 0-indexed (7 = August)
var currentDate = new Date();
currentDate.setHours(0,0,0,0);

var schedule = [];

function getFormattedDate(d) {
  var day = String(d.getDate()).padStart(2, '0');
  var mon = String(d.getMonth() + 1).padStart(2, '0');
  var yr = d.getFullYear();
  return day + '/' + mon + '/' + yr;
}

var latestAvailableDay = 1;

for (var i = 0; i < 90; i++) {
  var testDate = new Date(startDate);
  testDate.setDate(startDate.getDate() + i);
  testDate.setHours(0,0,0,0);

  var dayNum = i + 1;
  var dateString = getFormattedDate(testDate);
  
  // Jo date aa chuki hai ya guzar chuki hai, wo sabhi UNLOCKED rahengi
  var isUnlocked = (testDate <= currentDate);
  var isToday = (testDate.getTime() === currentDate.getTime());

  if (isUnlocked) {
    latestAvailableDay = dayNum;
  }

  var labelText = 'Day ' + dayNum + ' • ' + dateString;
  if (isToday) {
    labelText += ' (⚡ आज का टेस्ट)';
  } else if (!isUnlocked) {
    labelText += ' 🔒 [Lock]';
  } else {
    labelText += ' ✅ [खुला है]';
  }

  schedule.push({
    day: dayNum,
    date: dateString,
    unlocked: isUnlocked,
    label: labelText
  });
}

var selectBox = document.getElementById('daySelect');
selectBox.innerHTML = '';
schedule.forEach(function(item) {
  var opt = document.createElement('option');
  opt.value = item.day;
  opt.textContent = item.label;
  selectBox.appendChild(opt);
});

var cdpList = [
  "पियाजे के अनुसार संज्ञानात्मक विकास की मूर्त संक्रियात्मक अवस्था की आयु क्या है?",
  "वायगोत्स्की के अनुसार बच्चे किसके माध्यम से सबसे बेहतर सीखते हैं?",

];

  "पर्यावरण अध्ययन में क्षेत्र भ्रमण (Field Trip) का प्राथमिक उद्देश्य क्या है?",

var questions = [];
var current = 0;
var answers = [];
var review = [];
var submitted = false;
var timerSeconds = 150 * 60;
var timerInterval = null;
var activeDay = 1;
var selectedLang2 = 'english';

function buildQuestions(day, lang2) {
  var seed = day * 7;
  var qArr = [];
  for (var i = 0; i < 30; i++) {
    var txt = cdpList[(seed + i) % cdpList.length];
    qArr.push({
      q: '[CDP Day-' + day + ' Q.' + (i + 1) + '] ' + txt,
      options: ["सक्रिय ज्ञान निर्माण और अनुभव", "सामाजिक संवाद और सहयोग", "7 से 11 वर्ष", "मूर्त चिंतन स्तर"],
      answer: (seed + i) % 4,
      explanation: "बाल विकास एवं शिक्षाशास्त्र के आधारभूत सिद्धांतों पर आधारित प्रश्न।",
      sub: "भाग 1: बाल विकास एवं शिक्षाशास्त्र (CDP)"
    });
  }
  for (var i = 0; i < 30; i++) {
    var txt = hindi1List[(seed + i) % hindi1List.length];
    qArr.push({
      q: '[हिन्दी (भाषा-1) Day-' + day + ' Q.' + (i + 1) + '] ' + txt,
      options: ["अर्थपूर्ण अभिव्यक्ति का विकास", "नोम चॉम्स्की", "उदाहरण से नियम की ओर", "अधिगम कठिनाई का निवारण"],
      answer: (seed + i + 1) % 4,
      explanation: "हिन्दी भाषा शिक्षण कौशल और भाषायी समझ पर आधारित।",
      sub: "भाग 2: भाषा-1 (हिन्दी)"
    });
  }
  if (lang2 === 'sanskrit') {
    for (var i = 0; i < 30; i++) {
      var txt = sanskritList[(seed + i) % sanskritList.length];
      qArr.push({
        q: '[संस्कृत (भाषा-2) Day-' + day + ' Q.' + (i + 1) + '] ' + txt,
        options: ["मातृभाषायाः अप्रयोगः (Direct)", "आगमन-निगमन विधिः", "श्रवणं, भाषणं, पठनं, लेखनम्", "मौखिक-अभिव्यक्ति-अवसरः"],
        answer: (seed + i + 2) % 4,
        explanation: "संस्कृत भाषा शिक्षण विधयः एवं व्याकरण शिक्षण कौशलानि।",
        sub: "भाग 3: भाषा-2 (संस्कृत)"
      });
    }
  } else if (lang2 === 'hindi2') {
    for (var i = 0; i < 30; i++) {
      var txt = hindi2List[(seed + i) % hindi2List.length];
      qArr.push({
        q: '[हिन्दी (भाषा-2) Day-' + day + ' Q.' + (i + 1) + '] ' + txt,
        options: ["सहज संप्रेषण अवसर", "अवधारणा को स्पष्ट एवं रुचिकर बनाना", "श्रुतलेख व अभ्यास", "प्राथमिक स्तर"],
        answer: (seed + i + 2) % 4,
        explanation: "द्वितीय भाषा के रूप में हिन्दी शिक्षण कौशल और शिक्षण विधियाँ।",
        sub: "भाग 3: भाषा-2 (हिन्दी)"
      });
    }
  } else {
    for (var i = 0; i < 30; i++) {
      var txt = englishList[(seed + i) % englishList.length];
      qArr.push({
        q: '[English (Language-2) Day-' + day + ' Q.' + (i + 1) + '] ' + txt,
        options: ["Communicative Language Teaching", "Formative Diagnostic Feedback", "Listening and Reading", "Identifying Learning Gaps"],
        answer: (seed + i + 2) % 4,
        explanation: "Language pedagogy, communicative approaches, and comprehension.",
        sub: "भाग 3: भाषा-2 (English)"
      });
    }
  }
  for (var i = 0; i < 30; i++) {
    var txt = mathList[(seed + i) % mathList.length];
    qArr.push({
      q: '[गणित Day-' + day + ' Q.' + (i + 1) + '] ' + txt,
      options: ["प्रत्यक्षीकरण (Visualization)", "अनुभव-भाषा-चित्र-प्रतीक (ELPS)", "800", "अवधारणात्मक त्रुटि की पहचान"],
      answer: (seed + i + 3) % 4,
      explanation: "प्राथमिक गणितीय अवधारणाओं एवं शिक्षणशास्त्र पर आधारित।",
      sub: "भाग 4: गणित (Mathematics)"
    });
  }
  for (var i = 0; i < 30; i++) {
    var txt = evsList[(seed + i) % evsList.length];
    qArr.push({
      q: '[पर्यावरण Day-' + day + ' Q.' + (i + 1) + '] ' + txt,
      options: ["कार्य एवं खेल (Work & Play)", "बारहसिंगा", "कार्बन डाइऑक्साइड", "प्रत्यक्ष एवं व्यावहारिक अनुभव"],
      answer: (seed + i) % 4,
      explanation: "NCERT/SCERT पर्यावरण अध्ययन पाठ्यक्रम पर आधारित।",
      sub: "भाग 5: पर्यावरण अध्ययन (EVS)"
    });
  }
  return qArr;
}

function loadDayTest(day) {
  activeDay = day;
  var item = schedule[day - 1] || schedule[0];
  document.getElementById('daySelect').value = item.day;
  
  if (!item.unlocked) {
    document.getElementById('lockScreen').style.display = 'block';
    document.getElementById('testArea').style.display = 'none';
    document.getElementById('result').style.display = 'none';
    document.getElementById('lockTitle').textContent = 'Day ' + item.day + ' (' + item.date + ') का टेस्ट लॉक है!';
    document.getElementById('lockMsg').textContent = 'यह टेस्ट निर्धारित दिनांक (' + item.date + ') आने पर ही खुलेगा।';
    document.getElementById('dayDisplay').textContent = '🔒 Day ' + item.day + ' (Locked)';
    return;
  }

  document.getElementById('lockScreen').style.display = 'none';
  document.getElementById('testArea').style.display = 'grid';
  document.getElementById('result').style.display = 'none';
  document.getElementById('dayDisplay').textContent = 'Day ' + item.day + ' • ' + item.date;

  questions = buildQuestions(item.day, selectedLang2);
  current = 0;
  answers = [];
  review = [];
  for (var k = 0; k < questions.length; k++) {
    answers.push(null);
    review.push(false);
  }
  submitted = false;

  clearInterval(timerInterval);
  timerSeconds = 150 * 60;
  timerInterval = setInterval(updateTimer, 1000);

  renderQuestion();
}

function changeLanguage2() {
  selectedLang2 = document.getElementById('lang2Choice').value;
  var savedCurrent = current;
  questions = buildQuestions(activeDay, selectedLang2);
  current = savedCurrent;
  renderQuestion();
}

function jumpToQuestion(qIdx) {
  current = qIdx;
  renderQuestion();
}

function updateActiveTab() {
  var tabIdx = Math.floor(current / 30);
  for (var i = 0; i < 5; i++) {
    var btn = document.getElementById('tab' + i);
    if (btn) {
      if (i === tabIdx) btn.className = 'sec-tab active';
      else btn.className = 'sec-tab';
    }
  }
  var lang2Box = document.getElementById('lang2SelectBox');
  if (lang2Box) {
    lang2Box.style.display = (tabIdx === 2) ? 'flex' : 'none';
  }
}

function onSelectChange() {
  var selectedDay = parseInt(document.getElementById('daySelect').value);
  loadDayTest(selectedDay);
}

function loadLatestActiveDay() {
  loadDayTest(latestAvailableDay);
}

function updateTimer() {
  if (submitted) return;
  timerSeconds--;
  if (timerSeconds < 0) {
    submitTest();
    return;
  }
  var h = Math.floor(timerSeconds / 3600);
  var m = Math.floor((timerSeconds % 3600) / 60);
  var s = timerSeconds % 60;
  document.getElementById('timer').textContent = 
    (h > 0 ? (h < 10 ? '0' + h : h) + ':' : '') + 
    (m < 10 ? '0' + m : m) + ':' + 
    (s < 10 ? '0' + s : s);
}

function selectOption(idx) {
  if (submitted) return;
  if (answers[current] !== null) return;
  answers[current] = idx;
  playBeep(idx === questions[current].answer);
  renderQuestion();
}

function renderQuestion() {
  if (!questions || questions.length === 0) return;
  var q = questions[current];
  document.getElementById('qno').textContent = 'प्रश्न ' + (current + 1) + ' / ' + questions.length;
  document.getElementById('subIndicator').textContent = q.sub;
  document.getElementById('question').textContent = q.q;
  var box = document.getElementById('options');
  box.innerHTML = '';
  var userAns = answers[current];
  var answered = (userAns !== null);
  for (var i = 0; i < q.options.length; i++) {
    var lab = document.createElement('label');
    lab.className = 'option';
    if (answered) {
      lab.style.pointerEvents = 'none';
      lab.style.cursor = 'default';
      if (i === q.answer) lab.className += ' correct-opt';
      else if (i === userAns) lab.className += ' wrong-opt';
    }
    lab.innerHTML = '<input type="radio" name="opt" ' + (userAns === i ? 'checked' : '') + (answered ? ' disabled' : '') + '> <span><b>' + String.fromCharCode(65 + i) + '.</b> ' + q.options[i] + '</span>';
    (function(optionIndex) {
      lab.onclick = function() { selectOption(optionIndex); };
    })(i);
    box.appendChild(lab);
  }
  var exp = document.getElementById('instantExplanation');
  if (answered) {
    var ok = (userAns === q.answer);
    exp.innerHTML = '<div class="instant-exp"><b>' + (ok ? '✅ सही उत्तर!' : '❌ गलत उत्तर!') + '</b><br><b>सही उत्तर: ' + q.options[q.answer] + '</b><br>' + q.explanation + '</div>';
  } else {
    exp.innerHTML = '';
  }
  updateActiveTab();
  drawPalette();
}

function drawPalette() {
  var p = document.getElementById('palette');
  p.innerHTML = '';
  for (var i = 0; i < questions.length; i++) {
    var b = document.createElement('button');
    b.className = 'num ' + (i === current ? 'current ' : '') + (answers[i] !== null ? 'answered ' : '') + (review[i] ? 'review' : '');
    b.textContent = (i + 1);
    (function(numIdx) {
      b.onclick = function() { current = numIdx; renderQuestion(); };
    })(i);
    p.appendChild(b);
  }
}

function nextQ() {
  if (current < questions.length - 1) {
    current++;
    renderQuestion();
  }
}

function prevQ() {
  if (current > 0) {
    current--;
    renderQuestion();
  }
}

function toggleReview() {
  review[current] = !review[current];
  renderQuestion();
}

function submitTest() {
  if (submitted) return;
  if (!confirm('क्या आप सचमुच टेस्ट Submit करना चाहते हैं?')) return;
  submitted = true;
  clearInterval(timerInterval);
  var score = 0;
  for (var i = 0; i < questions.length; i++) {
    if (answers[i] === questions[i].answer) score++;
  }
  document.getElementById('testArea').style.display = 'none';
  document.getElementById('result').style.display = 'block';
  document.getElementById('timer').textContent = 'SUBMITTED';
  document.getElementById('score').textContent = score + ' / ' + questions.length;
  var pct = ((score / questions.length) * 100).toFixed(2);
  document.getElementById('percent').textContent = 'प्राप्तांक: ' + pct + '%';
  document.getElementById('summary').textContent = score >= 90 ? 'उत्कृष्ट प्रदर्शन! आप पात्रता परीक्षा के स्तर के अनुसार उत्तीर्ण हैं।' : 'अभ्यास जारी रखें और कमजोर विषयों की व्याख्या का अध्ययन करें।';
  var r = document.getElementById('review');
  r.innerHTML = '<h2> संपूर्ण 150 प्रश्नों का उत्तर व व्याख्या</h2>';
  for (var j = 0; j < questions.length; j++) {
    var isOk = (answers[j] === questions[j].answer);
    var div = document.createElement('div');
    div.className = 'reviewcard ' + (isOk ? 'correct' : 'wrong');
    div.innerHTML = '<span style="color:#155eef;font-size:11px;font-weight:bold">' + questions[j].sub + '</span><b>प्रश्न ' + (j + 1) + '. ' + questions[j].q + '</b><div>आपका उत्तर: ' + (answers[j] === null ? 'नहीं दिया' : questions[j].options[answers[j]]) + '<br><strong>सही उत्तर: ' + questions[j].options[questions[j].answer] + '</strong><br>' + questions[j].explanation + '</div>';
    r.appendChild(div);
  }
}

// Auto-load latest available test
loadDayTest(latestAvailableDay);
</script>
