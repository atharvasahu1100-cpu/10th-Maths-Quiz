/* ==========================================
   AUDIO
   ========================================== */

function initAudio() {

    if (!audioCtx) {

        audioCtx =
            new (window.AudioContext ||
            window.webkitAudioContext)();
    }

    if (audioCtx.state === "suspended") {

        audioCtx.resume();
    }
}


function playCorrectSound() {

    initAudio();

    let now = audioCtx.currentTime;

    for (let i = 0; i < 5; i++) {

        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();

        osc.type = "triangle";

        osc.frequency.setValueAtTime(
            400 + (i * 120),
            now + (i * 0.05)
        );

        gain.gain.setValueAtTime(
            0.2,
            now + (i * 0.05)
        );

        gain.gain.exponentialRampToValueAtTime(
            0.001,
            now + (i * 0.05) + 0.12
        );

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(now + (i * 0.05));

        osc.stop(
            now + (i * 0.05) + 0.12
        );
    }
}


function playWrongSound() {

    initAudio();

    let now = audioCtx.currentTime;

    let osc = audioCtx.createOscillator();
    let gain = audioCtx.createGain();

    osc.type = "sawtooth";

    osc.frequency.setValueAtTime(
        160,
        now
    );

    osc.frequency.setValueAtTime(
        90,
        now + 0.15
    );

    gain.gain.setValueAtTime(
        0.3,
        now
    );

    gain.gain.exponentialRampToValueAtTime(
        0.001,
        now + 0.35
    );

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start(now);
    osc.stop(now + 0.35);
}

function startTimer() {

    timeLeft = 30;

    timeEl.innerText = timeLeft;

    timer = setInterval(() => {

        timeLeft--;

        timeEl.innerText = timeLeft;

        if (timeLeft <= 0) {

            clearInterval(timer);

            autoSelectWrong();
        }

    }, 1000);
}


/* ==========================================
   LOAD QUESTION
   ========================================== */

function loadQuestion() {

    clearInterval(timer);

    startTimer();

    expBox.style.display = "none";

    nextBtn.style.display = "none";


    let q = quizData[currentQuestion];


    countEl.innerText =
        `प्रश्न ${currentQuestion + 1} / ${quizData.length}`;

    questionEl.innerText =
        q.question;


    optionsEl.innerHTML = "";


    q.options.forEach((opt, index) => {

        let btn =
            document.createElement("button");

        btn.className =
            "option-btn";

        btn.innerText =
            opt;

        btn.onclick =
            () => selectOption(index);

        optionsEl.appendChild(btn);

    });
}

        optionsEl.children;


    if (selected === q.correct) {

        buttons[selected]
            .classList.add("correct");

        score++;

        playCorrectSound();

    } else {

        buttons[selected]
            .classList.add("wrong");

        buttons[q.correct]
            .classList.add("correct");

        playWrongSound();
    }


    for (let btn of buttons) {

        btn.disabled = true;
    }


    expText.innerText =
        q.explanation;

    expBox.style.display =
        "block";

    nextBtn.style.display =
        "block";
}


/* ==========================================
   TIME OVER
   ========================================== */

function autoSelectWrong() {

    let q =
        quizData[currentQuestion];

    let buttons =
        optionsEl.children;


    buttons[q.correct]
        .classList.add("correct");


    for (let btn of buttons) {

        btn.disabled = true;
    }


    playWrongSound();


    expText.innerText =
        "समय समाप्त! सही उत्तर था: " +
        q.options[q.correct] +
        ". " +
        q.explanation;


    expBox.style.display =
        "block";

    nextBtn.style.display =
        "block";
}


/* ==========================================
   NEXT QUESTION
   ========================================== */

function nextQuestion() {

    currentQuestion++;

    if (currentQuestion < quizData.length) {

        loadQuestion();

    } else {

        finishTest();
    }
}


/* ==========================================
   FINISH TEST
   ========================================== */

function finishTest() {

    quizScreen.style.display =
        "none";

    resultScreen.style.display =
        "block";


    finalScoreEl.innerText =
        `${score} / ${quizData.length}`;


    document
        .getElementById("result-student-info")
        .innerText =
        `विद्यार्थी: ${studentName} (${studentMobile})`;


    let winAudio =
        document.getElementById("win-sound");

    if (winAudio) {

        winAudio.currentTime = 0;

        winAudio.play()
            .catch(e => {});
    }


    if (score >= 13) {

        badgeEl.innerText =
            "🏆 प्रथम श्रेणी - गणित जीनियस";

    } else if (score >= 8) {

        badgeEl.innerText =
            "⭐ बहुत बढ़िया प्रदर्शन!";

    } else {

        badgeEl.innerText =
            "💪 और अधिक अभ्यास की आवश्यकता है!";
    }


    sendDataToSheet(
        studentName,
        studentMobile,
        score
    );
}


/* ==========================================
   SAVE RESULT
   ========================================== */

function sendDataToSheet(
    name,
    mobile,
    finalScore
) {

    const formData =
        new URLSearchParams();


    formData.append(
        "name",
        name
    );

    formData.append(
        "mobile",
        mobile
    );

    // केवल numeric score भेजा जाएगा
    formData.append(
        "score",
        finalScore
    );


    fetch(SCRIPT_URL, {

        method: "POST",

        body: formData

    })

    .then(response =>
        response.text()
    )

    .then(data => {

        document
            .getElementById("submitting-msg")
            .innerText =
            "✅ Result सफलतापूर्वक CurrentWeek में save हो गया!";

        document
            .getElementById("submitting-msg")
            .style.color =
            "#28a745";

    })

    .catch(error => {

        console.error(
            "Error:",
            error
        );

        document
            .getElementById("submitting-msg")
            .innerText =
            "⚠️ Result save करने में समस्या आई, कृपया दोबारा कोशिश करें।";

        document
            .getElementById("submitting-msg")
            .style.color =
            "#dc3545";
    });
}


/* ==========================================
   SHOW SOLUTIONS
   ========================================== */

function showAllSolutions() {

    resultScreen.style.display =
        "none";

    solutionsScreen.style.display =
        "block";


    let solList =
        document.getElementById(
            "solutions-list"
        );


    solList.innerHTML = "";


    quizData.forEach((q) => {

        let div =
            document.createElement("div");


        div.style.background =
            "#f8f9fa";

        div.style.padding =
            "12px";

        div.style.margin =
            "10px 0";

        div.style.borderRadius =
            "10px";

        div.style.borderLeft =
            "4px solid #2563eb";


        div.innerHTML =
            `<strong>${q.question}</strong><br><br>
             <span style="color:#28a745;font-size:15px;">
             ✅ सही उत्तर: ${q.options[q.correct]}
             </span><br><br>
             <span style="color:#444;font-size:14px;line-height:1.5;">
             💡 <b>समाधान:</b> ${q.explanation}
             </span>`;


        solList.appendChild(div);

    });
}

</script>
