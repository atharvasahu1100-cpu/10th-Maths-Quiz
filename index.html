    let currentCh = 0, currentQ = 0;

    function showSection(id) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(id === 'quiz-menu') initQuizMenu();
    }

    function initQuizMenu() {
        const list = document.getElementById('chapter-list');
        list.innerHTML = "";
        allChaptersData.forEach((ch, i) => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'chapter-btn';
            btn.innerText = ch.title;
            btn.onclick = () => { currentCh = i; currentQ = 0; showSection('quiz-screen'); loadQuestion(); };
            list.appendChild(btn);
        });
    }

    function loadQuestion() {
        const q = allChaptersData[currentCh].questions[currentQ];
        document.getElementById('question-text').innerText = `प्रश्न ${currentQ+1}/${allChaptersData[currentCh].questions.length}: ${q.q}`;
        const box = document.getElementById('options-box');
        box.innerHTML = "";
        q.options.forEach((opt, i) => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.innerText = opt;
            btn.onclick = () => {
                const allBtns = box.getElementsByTagName('button');
                if (i === q.ans) {
                    btn.classList.add('correct');
                } else {
                    btn.classList.add('wrong');
                    allBtns[q.ans].classList.add('correct');
                }
                for (let b of allBtns) { b.disabled = true; }
                document.getElementById('next-btn').style.display = 'block';
            };
            box.appendChild(btn);
        });
    }

    function nextQuestion() {
        currentQ++;
        if(currentQ < allChaptersData[currentCh].questions.length) {
            document.getElementById('next-btn').style.display = 'none';
            loadQuestion();
        } else {
            alert('शाबाश! आपने इस अध्याय का क्विज़ पूरा कर लिया है।');
            showSection('quiz-menu');
        }
    }

    window.onload = function() {
        showSection('home-screen');
    };
