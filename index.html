<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rajesh Sir Maths Quiz</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 15px; color: #333; }
        .container { max-width: 600px; margin: auto; background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h3 { text-align: center; color: #007bff; }
        .home-card { text-align: center; }
        .menu-btn { display: block; width: 100%; padding: 14px; margin: 12px 0; font-size: 16px; font-weight: bold; color: white; border: none; border-radius: 8px; cursor: pointer; text-decoration: none; text-align: center; box-sizing: border-box; }
        .btn-daily { background: #28a745; }
        .btn-quiz { background: #0096d6; }
        .btn-formula { background: #f39c12; }
        .btn-whatsapp { background: #9b59b6; }
    </style>
</head>
<body>

<div class="container" id="home-screen">
    <div class="home-card">
        <h3>📚 गणित स्टडी पोर्टल (MP Board)</h3>
        
        <!-- 1. नया टाइमर वाला दैनिक टेस्ट बटन (जो सीधे 'test.html' पर जाएगा) -->
        <a href="test.html" class="menu-btn btn-daily">⚡ आज का टाइमर टेस्ट (अध्याय 1)</a>
        
        <!-- 2. आपके पुराने अध्यायवार क्विज़ बटन -->
        <button class="menu-btn btn-quiz" onclick="alert('अध्यायवार क्विज़ (1 से 14) सूची यहाँ उपलब्ध है!')">📝 अध्यायवार क्विज़ (1 से 14)</button>
        
        <!-- 3. आपके पुराने महत्वपूर्ण सूत्र बटन -->
        <button class="menu-btn btn-formula" onclick="alert('सभी महत्वपूर्ण सूत्र यहाँ उपलब्ध हैं!')">📐 सभी महत्वपूर्ण सूत्र</button>
        
        <!-- 4. व्हाट्सएप डाउट पूछने का बटन -->
        <a href="https://whatsapp.com" target="_blank" class="menu-btn btn-whatsapp">💬 डाउट पूछें (WhatsApp)</a>
    </div>
</div>

</body>
</html>
