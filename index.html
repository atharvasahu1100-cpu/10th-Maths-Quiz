<script>

let currentSection = 'home-screen';
let handlingPopState = false;


/* Home history state */
history.replaceState(
  {section:'home-screen'},
  '',
  location.href
);


/* Section change */
function showSection(id, fromBack = false){

  document.querySelectorAll('.section')
    .forEach(s => s.classList.remove('active'));

  const section = document.getElementById(id);

  if(section){
    section.classList.add('active');
  }

  currentSection = id;

  window.scrollTo(0,0);

  if(
    !fromBack &&
    !handlingPopState &&
    id !== 'home-screen'
  ){

    history.pushState(
      {section:id},
      '',
      location.href
    );
  }

}


/* =========================================
   CLASS SELECT
========================================= */

function selectClass(page){

  if(!page){
    return;
  }

  window.location.href = page;
}


/* =========================================
   FORCE RESET CLASS DROPDOWN
========================================= */

function resetClassDropdown(){

  const select = document.getElementById('class-select');

  if(!select){
    return;
  }

  /* सभी पुराने selected attributes हटाएँ */
  Array.from(select.options).forEach(function(option){
    option.removeAttribute('selected');
  });

  /* पहला option selected करें */
  select.options[0].setAttribute('selected','selected');

  /* dropdown को force करके पहले option पर लाएँ */
  select.selectedIndex = 0;
  select.value = "";

}


/* =========================================
   HOME RESET
========================================= */

function forceHomeReset(){

  resetClassDropdown();

  /*
    Browser कभी-कभी Back button पर
    पुराना form state बाद में restore करता है।
    इसलिए थोड़ी देर बाद दोबारा reset।
  */

  setTimeout(function(){
    resetClassDropdown();
  }, 50);

  setTimeout(function(){
    resetClassDropdown();
  }, 200);

  setTimeout(function(){
    resetClassDropdown();
  }, 500);

}


/* =========================================
   PAGE SHOW
========================================= */

window.addEventListener('pageshow', function(event){

  forceHomeReset();

});


/* =========================================
   PAGE LOAD
========================================= */

window.addEventListener('load', function(){

  forceHomeReset();

});


/* =========================================
   ANDROID / BROWSER BACK BUTTON
========================================= */

window.addEventListener('popstate', function(){

  handlingPopState = true;

  if(currentSection !== 'home-screen'){

    showSection(
      'home-screen',
      true
    );

  }

  forceHomeReset();

  handlingPopState = false;

});


/* =========================================
   FEATURE
========================================= */

function openFeature(type){

  const map = {

    daily:[
      'आज का गणित',
      'Daily concept और practice यहाँ connect होगा।'
    ],

    study:[
      'अध्ययन सामग्री',
      'आपकी मौजूदा study material page यहाँ connect होगी।'
    ],

    quiz:[
      'Chapter Quiz',
      'अध्यायवार quiz यहाँ connect होगा।'
    ],

    weekly:[
      'Weekly Challenge',
      'आपका weekly timer test यहाँ connect होगा।'
    ],

    result:[
      'मेरा Result',
      'Google Sheet / Apps Script से result यहाँ connect होगा।'
    ],

    formula:[
      'महत्वपूर्ण सूत्र',
      'Formula page यहाँ connect होगा।'
    ],

    book:[
      'गणित पुस्तक',
      'Textbook page यहाँ connect होगा।'
    ]

  };


  document.getElementById('feature-title').innerText =
    map[type][0];

  document.getElementById('feature-text').innerText =
    map[type][1];

  showSection('feature-screen');

}

</script>
