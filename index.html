<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rajesh Sir Maths Quiz Portal</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #0984e3, #74b9ff); margin: 0; padding: 15px; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .main-container { width: 100%; max-width: 480px; background: #ffffff; padding: 20px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.25); }
        .logo-area { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 15px; }
        .logo-box { background: #0984e3; color: #fdcb6e; font-weight: bold; padding: 8px 12px; border-radius: 8px; font-size: 18px; border: 2px solid #fdcb6e; }
        .title-text { font-size: 18px; font-weight: bold; color: #2d3436; }
        h2 { font-size: 20px; color: #2d3436; margin: 10px 0 5px 0; text-align: center; }
        .subtitle { color: #636e72; font-size: 14px; margin-bottom: 15px; text-align: center; }
        .btn { display: block; width: 100%; padding: 14px; margin: 10px 0; border-radius: 14px; font-size: 15px; font-weight: bold; text-decoration: none; color: white; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; border: none; cursor: pointer; transition: 0.2s; }
        .btn:active { transform: scale(0.98); }
        .btn-1 { background: linear-gradient(135deg, #0984e3, #74b9ff); }
        .btn-2 { background: #636e72; }
        .btn-3 { background: linear-gradient(135deg, #6c5ce7, #a29bfe); }
        .btn-4 { background: linear-gradient(135deg, #00b894, #55efc4); }
        .btn-5 { background: linear-gradient(135deg, #ff7675, #fab1a0); }
        .btn-6 { background: linear-gradient(135deg, #00cec9, #81ecec); color: #2d3436; }
        .chapter-btn { display: block; width: 100%; padding: 11px; margin: 7px 0; background-color: #f8f9fa; border: 1px solid #dcdde1; border-radius: 8px; cursor: pointer; font-size: 14px; text-align: left; font-weight: 600; color: #2c3e50; }
        .chapter-btn:hover { background-color: #e3f2fd; border-color: #2196f3; color: #0d47a1; }
        .option-btn { display: block; width: 100%; padding: 11px; margin: 8px 0; background-color: #ecf0f1; border: 2px solid #bdc3c7; border-radius: 8px; cursor: pointer; font-size: 14px; text-align: left; }
        .option-btn.correct { background-color: #2ecc71 !important; color: white; border-color: #27ae60; }
        .option-btn.wrong { background-color: #e74c3c !important; color: white; border-color: #c0392b; }
        .hidden { display: none !important; }
        .question-text { font-size: 15px; font-weight: bold; margin-bottom: 12px; color: #2c3e50; }
    </style>
</head>
<body>
<div class="main-container">

    <!-- होम स्क्रीन (सारे 6 बटन) -->
    <div id="home-screen">
        <div class="logo-area">
            <div class="logo-box">RS</div>
            <div class="title-text">Rajesh Sir Maths Quiz</div>
        </div>
        <h2>📚 गणित स्टडी पोर्टल</h2>
        <div class="subtitle">MP Board Class 10th</div>
        
        <a href="test.html" class="btn btn-1">⚡ वीकली टाइमर टेस्ट दें</a>
        <a href="https://script.google.com/macros/s/AKfycbzat7J3WhIZzQ3KW04Ts4ghUvEogisk3F2uRvKg68iooDTq3aDTvNTwmFeblOFWZNFP5w/exec" target="_blank" class="btn btn-2">📊 छात्रों का पूरा रिकॉर्ड (Report)</a>
        <button class="btn btn-3" onclick="showQuizMenu()">📝 अध्यायवार क्विज़ (1 से 14)</button>
        <a href="#" class="btn btn-4">📖 गणित पाठ्यपुस्तक (अध्याय 1 से 14)</a>
        <a href="#" class="btn btn-5">📐 सभी महत्वपूर्ण सूत्र</a>
        <a href="https://wa.me/" target="_blank" class="btn btn-6">💬 डाउट पूछें (WhatsApp)</a>
    </div>

    <!-- अध्याय चयन स्क्रीन (बटन 3 दबाने पर खुलेगी) -->
    <div id="chapter-menu" class="hidden">
        <button class="btn btn-2" style="margin-top:0; padding:10px; font-size:14px;" onclick="goHome()">← होम पेज पर वापस जाएं</button>
        <h3 style="color: #e67e22; font-size: 16px; border-bottom: 2px solid #eee; padding-bottom: 6px; margin: 10px 0;">सभी अध्याय चुनें:</h3>
        <div id="chapter-list" style="max-height: 380px; overflow-y: auto;"></div>
    </div>

    <!-- क्विज़ स्क्रीन -->
    <div id="quiz-screen" class="hidden">
        <button class="btn btn-2" style="margin-top:0; padding:10px; font-size:14px;" onclick="showQuizMenu()">← अध्यायों की सूची पर जाएँ</button>
        <h3 id="current-chapter-title" style="color: #e67e22; font-size: 15px; margin: 8px 0;"></h3>
        <div id="quiz-content">
            <div class="question-text" id="q-text"></div>
            <div id="options-box"></div>
            <button id="next-btn" class="btn btn-1 hidden" style="margin-top:10px;" onclick="nextQuestion()">अगला प्रश्न</button>
        </div>
        <div id="result-box" class="hidden" style="text-align: center; padding: 20px 0;">
            <p id="final-score-text" style="font-size: 18px; font-weight: bold;"></p>
            <button class="btn btn-1" onclick="showQuizMenu()">दूसरे अध्याय पर जाएँ</button>
        </div>
    </div>

</div>

<script>
    const allChaptersData = [
        {
            title: "अध्याय 1: वास्तविक संख्याएँ",
            questions: [
                { q: "संख्या 140 का अभाज्य गुणनखंडन क्या है?", options: ["2 × 2 × 5 × 7", "2 × 3 × 5 × 7", "2 × 2 × 3 × 7", "5 × 5 × 2 × 7"], ans: 0 },
                { q: "संख्याओं 26 और 91 का HCF क्या होगा?", options: ["13", "7", "2", "26"], ans: 0 },
                { q: "यदि HCF (306, 657) = 9 है, तो LCM ज्ञात कीजिए:", options: ["22338", "22328", "23338", "22238"], ans: 0 },
                { q: "निम्नलिखित में से कौन सी एक अपरिमेय संख्या है?", options: ["√3", "√4", "9", "4/5"], ans: 0 }
            ]
        },
        {
            title: "अध्याय 2: बहुपद",
            questions: [
                { q: "घात दो के बहुपद को क्या कहते हैं?", options: ["द्विघात बहुपद", "रैखिक बहुपद", "त्रिघात बहुपद", "इनमें से कोई नहीं"], ans: 0 },
                { q: "द्विघात बहुपद ax² + bx + c के शून्यकों का योग होता है:", options: ["-b/a", "c/a", "a/b", "-c/a"], ans: 0 },
                { q: "यदि किसी बहुपद का ग्राफ x-अक्ष को 3 बिंदुओं पर काटता है, तो शून्यकों की संख्या होगी:", options: ["3", "2", "1", "0"], ans: 0 }
            ]
        },
        {
            title: "अध्याय 3: दो चर वाले रैखिक समीकरण युग्म",
            questions: [
                { q: "यदि a1/a2 = b1/b2 ≠ c1/c2 हो, तो रैखिक समीकरण युग्म का:", options: ["कोई हल नहीं होगा", "अद्वितीय हल होगा", "अनेक हल होंगे", "दो हल होंगे"], ans: 0 }
            ]
        },
        {
            title: "अध्याय 4: द्विघात समीकरण",
            questions: [
                { q: "द्विघात समीकरण का मानक रूप क्या है?", options: ["ax² + bx + c = 0", "ax + b = 0", "ax³ + bx² = 0", "कोई नहीं"], ans: 0 },
                { q: "द्विघात समीकरण ax² + bx + c = 0 के मूल वास्तविक नहीं होंगे यदि विविक्तकर (D):", options: ["D < 0", "D > 0", "D = 0", "D ≥ 0"], ans: 0 }
            ]
        },
        {
            title: "अध्याय 5: समांतर श्रेढियाँ",
            questions: [
                { q: "AP: 10, 7, 4, ... का 10वाँ पद क्या है?", options: ["-17", "10", "24", "-35"], ans: 0 }
            ]
        },
        {
            title: "अध्याय 6: त्रिभुज",
            questions: [
                { q: "सभी समबाहु त्रिभुज होते हैं:", options: ["समरूप", "सर्वांगसम", "समान नहीं", "इनमें से कोई नहीं"], ans: 0 }
            ]
        },
        {
            title: "अध्याय 7: निर्देशांक ज्यामिति",
            questions: [
                { q: "मूलबिंदु के निर्देशांक होते हैं:", options: ["(0, 0)", "(1, 1)", "(0, 1)", "(1, 0)"], ans: 0 }
            ]
        },
        {
            title: "अध्याय 8: त्रिकोणमिति का परिचय",
            questions: [
                { q: "9sec²A - 9tan²A बराबर है:", options: ["9", "1", "8", "0"], ans: 0 }
            ]
        },
        {
            title: "अध्याय 9: त्रिकोणमिति के कुछ अनुप्रयोग",
            questions: [
                { q: "मीनार के पाद से 30 मीटर की दूरी पर स्थित बिंदु का उन्नयन कोण 30° है, ऊँचाई है:", options: ["10√3 मीटर", "30 मीटर", "15 मीटर", "30√3 मीटर"], ans: 0 }
            ]
        },
        {
            title: "अध्याय 10: वृत्त",
            questions: [
                { q: "एक वृत्त की कितनी स्पर्श रेखाएँ हो सकती हैं?", options: ["अनेक (अनंत)", "एक", "दो", "शून्य"], ans: 0 }
            ]
        },
        {
            title: "अध्याय 11: वृत्तों से संबंधित क्षेत्रफल",
            questions: [
                { q: "r त्रिज्या वाले वृत्त का क्षेत्रफल क्या होता है?", options: ["πr²", "2πr", "πr", "2πr²"], ans: 0 }
            ]
        },
        {
            title: "अध्याय 12: पृष्ठीय क्षेत्रफल और आयतन",
            questions: [
                { q: "एक गोले का पृष्ठीय क्षेत्रफल होता है:", options: ["4πr²", "2πr²", "πr²", "4/3 πr³"], ans: 0 }
            ]
        },
        {
            title: "अध्याय 13: सांख्यिकी",
            questions: [
                { q: "बहुलक, माध्यक और माध्य के बीच संबंध क्या है?", options: ["3 माध्यक = बहुलक + 2 माध्य", "मानक सूत्र", "माध्यक = बहुलक + माध्य", "इनमें से कोई नहीं"], ans: 0 }
            ]
        },
        {
            title: "अध्याय 14: प्रायिकता",
            questions: [
                { q: "किसी घटना की प्रायिकता का अधिकतम मान कितना होता है?", options: ["1", "0", "0.5", "2"], ans: 0 },
                { q: "निश्चित घटना की प्रायिकता होती है:", options: ["1", "0", "-1", "इनमें से कोई नहीं"], ans: 0 }
            ]
        }
    ];

    let selectedChapterIndex = 0;
    let currentQuestionIndex = 0;
    let score = 0;

    const homeScreen = document.getElementById("home-screen");
    const chapterMenu = document.getElementById("chapter-menu");
    const quizScreen = document.getElementById("quiz-screen");
    const chapterList = document.getElementById("chapter-list");
    const currentChapterTitle = document.getElementById("current-chapter-title");
    const qText = document.getElementById("q-text");
    const optionsBox = document.getElementById("options-box");
    const nextBtn = document.getElementById("next-btn");
    const quizContent = document.getElementById("quiz-content");
    const resultBox = document.getElementById("result-box");
    const finalScoreText = document.getElementById("final-score-text");

    function goHome() {
        chapterMenu.classList.add("hidden");
        quizScreen.classList.add("hidden");
        homeScreen.classList.remove("hidden");
    }

    function showQuizMenu() {
        homeScreen.classList.add("hidden");
        quizScreen.classList.add("hidden");
        chapterMenu.classList.remove("hidden");
        
        chapterList.innerHTML = "";
        allChaptersData.forEach((chapter, index) => {
            const btn = document.createElement("button");
            btn.className = "chapter-btn";
            btn.innerText = chapter.title;
            btn.onclick = () => startChapterQuiz(index);
            chapterList.appendChild(btn);
        });
    }

    function startChapterQuiz(index) {
        selectedChapterIndex = index;
        currentQuestionIndex = 0;
        score = 0;
        chapterMenu.classList.add("hidden");
        quizScreen.classList.remove("hidden");
        quizContent.classList.remove("hidden");
        resultBox.classList.add("hidden");
        currentChapterTitle.innerText = allChaptersData[selectedChapterIndex].title;
        loadQuestion();
    }

    function loadQuestion() {
        nextBtn.classList.add("hidden");
        optionsBox.innerHTML = "";
        const chapter = allChaptersData[selectedChapterIndex];
        const currentQ = chapter.questions[currentQuestionIndex];
        qText.innerText = `प्रश्न (${currentQuestionIndex + 1}/${chapter.questions.length}): ${currentQ.q}`;
        currentQ.options.forEach((option, i) => {
            const optBtn = document.createElement("button");
            optBtn.className = "option-btn";
            optBtn.innerText = option;
            optBtn.onclick = () => selectAnswer(i, optBtn);
            optionsBox.appendChild(optBtn);
        });
    }

    function selectAnswer(selectedIndex, btn) {
        const chapter = allChaptersData[selectedChapterIndex];
        const currentQ = chapter.questions[currentQuestionIndex];
        const allBtns = optionsBox.getElementsByTagName("button");
        if (selectedIndex === currentQ.ans) {
            btn.classList.add("correct");
            score++;
        } else {
            btn.classList.add("wrong");
            allBtns[currentQ.ans].classList.add("correct");
        }
        for (let b of allBtns) {
            b.disabled = true;
        }
        nextBtn.classList.remove("hidden");
    }

    function nextQuestion() {
        currentQuestionIndex++;
        const chapter = allChaptersData[selectedChapterIndex];
        if (currentQuestionIndex < chapter.questions.length) {
            loadQuestion();
        } else {
            quizContent.classList.add("hidden");
            resultBox.classList.remove("hidden");
            finalScoreText.innerHTML = `क्विज़ समाप्त! <br>आपका स्कोर: ${score} / ${chapter.questions.length}`;
        }
    }
</script>
</body>
</html>
