<!DOCTYPE html>
<html lang="hi">
<head>

  <title>गणित सेतु - कक्षा 10वीं</title>
  <style>
    body {
      font-family:'Noto Sans Devanagari','Poppins',sans-serif;
      margin:0;
      background:#F7F4F7;
    }

    header {
      background:#0041A1;
      color:white;
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:1rem;
    }

    header h1 {
      margin:0;
      font-size:1.5rem;
    }

    header select {
      background:white;
      color:#0041A1;
      font-weight:bold;
      padding:0.3rem;
      border-radius:5px;
    }

    /* Target Tracker */
    .target {
      background:white;
      margin:1rem;
      padding:1rem;
      border-radius:8px;
    }

    .progress-bar {
      background:#E3F2FD;
      border-radius:8px;
      overflow:hidden;
    }

    .progress-fill {
      background:#43AD47;
      height:20px;
      width:30%;
    }

    /* Section Cards */
    .section {
      margin:1rem;
    }

    .section h2 {
      margin-bottom:0.5rem;
    }

    .cards {
      display:flex;
      gap:1rem;
    }

    .card {
      flex:1;
      background:#F16000;
      color:white;
      padding:1rem;
      border-radius:8px;
      text-align:center;
      font-weight:bold;
    }

    .card img {
      height:40px;
      width:40px;
      object-fit:contain;
      display:block;
      margin:0 auto 5px;
    }

    /* Bottom Navigation */
    .nav {
      position:fixed;
      bottom:0;
      left:0;
      right:0;
      background:#0041A1;
      display:flex;
      justify-content:space-around;
      padding:0.5rem;
    }

    .nav a {
      color:white;
      text-decoration:none;
      font-size:0.9rem;
      text-align:center;
    }

    .nav img {
      height:20px;
      width:20px;
      object-fit:contain;
      display:block;
      margin:0 auto 5px;
    }
  </style>
</head>
