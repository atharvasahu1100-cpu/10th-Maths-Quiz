<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#082B59">
<title>गणित सेतु — मेरी टेस्ट रिपोर्ट</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:#f4f7fb;
  font-family:Arial,"Noto Sans Devanagari",sans-serif;
  color:#172033;
}

body{
  padding-bottom:20px;
}

.app{
  width:100%;
  max-width:850px;
  min-height:100vh;
  margin:auto;
  background:#fff;
}

.header{
  background:linear-gradient(135deg,#082B59,#0B63CE);
  color:#fff;
  padding:20px 16px;
  text-align:center;
  border-radius:0 0 18px 18px;
  box-shadow:0 5px 18px rgba(8,43,89,.18);
}

.header .tag{
  display:inline-block;
  background:rgba(255,255,255,.18);
  padding:5px 10px;
  border-radius:20px;
  font-size:11px;
  font-weight:800;
  margin-bottom:7px;
}

.header h1{
  margin:0;
  font-size:21px;
}

.header p{
  margin:6px 0 0;
  font-size:12px;
  opacity:.9;
}

.container{
  padding:14px;
}

.profile-card{
  background:#fff;
  border:1px solid #dbe4ef;
  border-radius:16px;
  padding:14px;
  margin-bottom:12px;
  box-shadow:0 3px 12px rgba(15,23,42,.05);
}

.student-row{
  display:flex;
  align-items:center;
  gap:12px;
}

.avatar{
  width:48px;
  height:48px;
  flex:0 0 48px;
  border-radius:14px;
  display:grid;
  place-items:center;
  color:#fff;
  font-size:20px;
  font-weight:900;
  background:linear-gradient(135deg,#0B63CE,#082B59);
}

.student-info{
  flex:1;
  min-width:0;
}

.student-name{
  font-size:17px;
  font-weight:900;
  color:#172033;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.student-id{
  margin-top:3px;
  font-size:11px;
  color:#64748b;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:14px;
}

.stat{
  background:#f8fafc;
  border:1px solid #e2e8f0;
  border-radius:12px;
  padding:10px 6px;
  text-align:center;
}

.stat b{
  display:block;
  font-size:19px;
  color:#0B63CE;
}

.stat span{
  display:block;
  margin-top:2px;
  color:#64748b;
  font-size:10px;
  font-weight:700;
}

.section-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin:16px 2px 8px;
}

.section-title h2{
  margin:0;
  font-size:15px;
  color:#1e293b;
}

.refresh{
  border:0;
  background:#eef4ff;
  color:#0B63CE;
  border-radius:9px;
  padding:7px 10px;
  font-size:11px;
  font-weight:800;
  cursor:pointer;
}

.message{
  background:#fff;
  border:1px solid #dbe4ef;
  border-radius:14px;
  padding:22px 14px;
  text-align:center;
  color:#64748b;
  font-size:13px;
  box-shadow:0 3px 12px rgba(15,23,42,.04);
}

.message.error{
  color:#b42318;
  background:#fff7f7;
  border-color:#fecaca;
}

.report-wrap{
  background:#fff;
  border:1px solid #dbe4ef;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 3px 12px rgba(15,23,42,.05);
}

.table-scroll{
  width:100%;
  overflow-x:auto;
}

table{
  width:100%;
  min-width:720px;
  border-collapse:collapse;
}

thead{
  background:#082B59;
  color:#fff;
}

th{
  padding:11px 8px;
  font-size:11px;
  text-align:center;
  white-space:nowrap;
}

td{
  padding:11px 8px;
  border-bottom:1px solid #edf2f7;
  font-size:11px;
  text-align:center;
  vertical-align:middle;
}

tbody tr:nth-child(even){
  background:#f8fafc;
}

tbody tr:hover{
  background:#eef5ff;
}

.type{
  display:inline-block;
  padding:5px 7px;
  border-radius:7px;
  background:#eef4ff;
  color:#0B63CE;
  font-weight:800;
  font-size:10px;
  line-height:1.25;
}

.chapter{
  max-width:180px;
  text-align:left;
  line-height:1.35;
}

.score{
  font-weight:900;
  color:#0B63CE;
}

.percent{
  display:inline-block;
  padding:5px 8px;
  border-radius:8px;
  background:#ecfdf5;
  color:#15803d;
  font-weight:900;
}

.date{
  white-space:nowrap;
  color:#475569;
}

.back-btn{
  width:100%;
  margin-top:14px;
  padding:12px;
  border:0;
  border-radius:12px;
  background:linear-gradient(135deg,#082B59,#0B63CE);
  color:#fff;
  font-size:13px;
  font-weight:900;
  cursor:pointer;
}

.loading{
  display:inline-flex;
  align-items:center;
  gap:7px;
}

.dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#0B63CE;
  animation:pulse 1s infinite alternate;
}

@keyframes pulse{
  from{opacity:.3}
  to{opacity:1}
}

@media(max-width:600px){
  .container{
    padding:11px;
  }

  .header{
    padding:17px 13px;
  }

  .header h1{
    font-size:19px;
  }

  .stats{
    gap:6px;
  }

  .stat{
    padding:9px 4px;
  }

  .stat b{
    font-size:17px;
  }

  .stat span{
    font-size:9px;
  }

  .report-wrap{
    border-radius:14px;
  }
}
</style>
</head>

<body>
<div class="app">

  <div class="header">
    <div class="tag">गणित सेतु डिजिटल प्लेटफार्म</div>
    <h1>📊 मेरी टेस्ट रिपोर्ट</h1>
    <p>आपके द्वारा दिए गए सभी गणित टेस्ट का रिकॉर्ड</p>
  </div>

  <div class="container">

    <div id="studentCard" class="profile-card" style="display:none;">
      <div class="student-row">
        <div id="avatar" class="avatar">👤</div>
        <div class="student-info">
          <div id="studentName" class="student-name">विद्यार्थी</div>
          <div id="studentId" class="student-id"></div>
        </div>
      </div>

      <div class="stats">
        <div class="stat">
          <b id="totalTests">0</b>
          <span>कुल टेस्ट</span>
        </div>
        <div class="stat">
          <b id="bestPercent">0%</b>
          <span>सर्वश्रेष्ठ स्कोर</span>
        </div>
        <div class="stat">
          <b id="avgPercent">0%</b>
          <span>औसत प्रतिशत</span>
        </div>
      </div>
    </div>

    <div class="section-title">
      <h2>📋 टेस्ट इतिहास</h2>
      <button class="refresh" onclick="loadReport()">↻ Refresh</button>
    </div>

    <div id="reportArea" class="message">
      <span class="loading">
        <span class="dot"></span>
        रिपोर्ट लोड हो रही है...
      </span>
    </div>

    <button class="back-btn" onclick="goBack()">← वापस जाएँ</button>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://xgmeivfvuujculkplxjf.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_cORbSXbHOaHzsIHuh2CACQ_vwFXy-zE";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

// Login/Test Page में पहले से इस्तेमाल होने वाली जानकारी
const studentId =
  localStorage.getItem("studentId") || "";

const studentName =
  localStorage.getItem("studentName") || "विद्यार्थी";

document.getElementById("studentName").textContent = studentName;

if(studentId){
  document.getElementById("studentId").textContent =
    "विद्यार्थी ID: " + studentId;
}

const firstLetter =
  studentName.trim().charAt(0) || "👤";

document.getElementById("avatar").textContent = firstLetter;

function escapeHTML(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function formatDate(dateValue, timeValue){
  if(!dateValue) return "—";

  const d = new Date(
    `${dateValue}T${timeValue || "00:00:00"}`
  );

  if(Number.isNaN(d.getTime())){
    return escapeHTML(dateValue);
  }

  return d.toLocaleDateString("hi-IN",{
    day:"2-digit",
    month:"2-digit",
    year:"numeric"
  });
}

function getPercentClass(percent){
  const p = Number(percent || 0);

  if(p >= 80) return "excellent";
  if(p >= 50) return "good";
  return "low";
}

async function loadReport(){

  const area = document.getElementById("reportArea");

  if(!studentId){

    area.className = "message error";

    area.innerHTML = `
      <div style="font-size:28px;margin-bottom:8px;">🔐</div>
      <b>विद्यार्थी जानकारी उपलब्ध नहीं है</b>
      <div style="margin-top:5px;font-size:11px;">
        कृपया पहले विद्यार्थी के रूप में लॉगिन करें।
      </div>
    `;

    document.getElementById("studentCard").style.display = "none";
    return;
  }

  area.className = "message";

  area.innerHTML = `
    <span class="loading">
      <span class="dot"></span>
      रिपोर्ट लोड हो रही है...
    </span>
  `;

  try{

    const { data, error } = await supabaseClient
      .from("student_test_records")
      .select(`
        id,
        student_id,
        student_name,
        class_name,
        test_type,
        chapter,
        total_questions,
        correct_answers,
        wrong_answers,
        percentage,
        time_taken,
        test_date,
        test_time,
        created_at
      `)
      .eq("student_id", studentId)
      .order("created_at", {ascending:false});

    if(error) throw error;

    const records = Array.isArray(data) ? data : [];

    document.getElementById("studentCard").style.display = "block";

    document.getElementById("totalTests").textContent =
      records.length;

    if(records.length){

      const percentages = records.map(r =>
        Number(r.percentage || 0)
      );

      const best = Math.max(...percentages);

      const average =
        Math.round(
          percentages.reduce((a,b)=>a+b,0) /
          percentages.length
        );

      document.getElementById("bestPercent").textContent =
        best + "%";

      document.getElementById("avgPercent").textContent =
        average + "%";

      let html = `
        <div class="report-wrap">
          <div class="table-scroll">
            <table>
              <thead>
                <tr>
                  <th>क्र.</th>
                  <th>कक्षा</th>
                  <th>टेस्ट</th>
                  <th>अध्याय</th>
                  <th>स्कोर</th>
                  <th>प्रतिशत</th>
                  <th>समय</th>
                  <th>दिनांक</th>
                </tr>
              </thead>
              <tbody>
      `;

      records.forEach((r,index)=>{

        const percentage = Number(r.percentage || 0);

        html += `
          <tr>
            <td><b>${index + 1}</b></td>

            <td>
              ${escapeHTML(r.class_name || "—")}
            </td>

            <td>
              <span class="type">
                ${escapeHTML(r.test_type || "टेस्ट")}
              </span>
            </td>

            <td class="chapter">
              ${escapeHTML(r.chapter || "—")}
            </td>

            <td class="score">
              ${Number(r.correct_answers || 0)}
              /
              ${Number(r.total_questions || 0)}
            </td>

            <td>
              <span class="percent">
                ${percentage}%
              </span>
            </td>

            <td>
              ${escapeHTML(r.time_taken || "—")}
            </td>

            <td class="date">
              ${formatDate(r.test_date,r.test_time)}
            </td>
          </tr>
        `;
      });

      html += `
              </tbody>
            </table>
          </div>
        </div>
      `;

      area.className = "";
      area.innerHTML = html;

    }else{

      document.getElementById("bestPercent").textContent = "0%";
      document.getElementById("avgPercent").textContent = "0%";

      area.className = "message";

      area.innerHTML = `
        <div style="font-size:30px;margin-bottom:8px;">📝</div>
        <b>अभी कोई टेस्ट रिकॉर्ड नहीं मिला</b>
        <div style="margin-top:5px;font-size:11px;">
          टेस्ट देने के बाद आपका परिणाम यहाँ दिखाई देगा।
        </div>
      `;
    }

  }catch(error){

    console.error("Report Load Error:",error);

    area.className = "message error";

    area.innerHTML = `
      <div style="font-size:28px;margin-bottom:8px;">⚠️</div>
      <b>रिपोर्ट लोड नहीं हो सकी</b>
      <div style="margin-top:6px;font-size:11px;">
        कृपया कुछ देर बाद फिर प्रयास करें।
      </div>
    `;
  }
}

function goBack(){
  if(document.referrer){
    history.back();
  }else{
    window.location.href = "index.html";
  }
}

loadReport();
</script>

</body>
</html>
