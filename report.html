<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>गणित सेतु — प्रगतिशील पाठ्यक्रम टेस्ट परिणाम</title>
<style>
  body{font-family:Arial,"Noto Sans Devanagari",sans-serif;background:#f8fafc;color:#172033;margin:0;padding:15px;}
  .container{max-width:700px;margin:auto;background:#fff;border-radius:16px;padding:20px;box-shadow:0 4px 15px rgba(0,0,0,0.05)}
  h2{color:#0B63CE;text-align:center;margin-top:0;}
  .result-card{background:#f8fbff;border:1px solid #cbd5e1;border-radius:12px;padding:14px 16px;margin-bottom:12px;box-shadow:0 2px 6px rgba(0,0,0,0.02)}
  .result-header{display:flex;justify-content:space-between;align-items:center;font-weight:bold;font-size:15px;color:#1e293b;margin-bottom:6px;}
  .result-details{font-size:12px;color:#64748b;display:flex;justify-content:space-between;margin-top:4px;}
  .score-badge{background:#e0f2fe;color:#0369a1;padding:4px 8px;border-radius:6px;font-weight:bold;}
  .time-badge{background:#fef3c7;color:#92400e;padding:3px 8px;border-radius:6px;font-weight:bold;font-size:11px;}
  .back-btn{display:inline-block;margin-bottom:15px;padding:8px 12px;background:#0B63CE;color:#fff;text-decoration:none;border-radius:8px;font-size:13px;font-weight:bold;}
</style>
</head>
<body>

<div class="container">
  <a href="index.html" class="back-btn">← होम पेज पर जाएँ</a>
  <h2>📊 प्रगतिशील पाठ्यक्रम टेस्ट परिणाम</h2>
  <div id="resultsList">
    <p style="text-align:center;color:#64748b;">परिणाम लोड हो रहे हैं...</p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://xgmeivfvuujculkplxjf.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_cORbSXbHOaHzsIHuh2CACQ_vwFXy-zE";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

async function loadResults() {
  const listEl = document.getElementById("resultsList");
  try {
    const { data, error } = await supabaseClient
      .from("student_test_results")
      .select("*")
      .eq("test_type", "प्रगतिशील पाठ्यक्रम टेस्ट")
      .order("created_at", { ascending: false })
      .limit(50);

    if (error) throw error;

    if (!data || data.length === 0) {
      listEl.innerHTML = `<p style="text-align:center;color:#64748b;">अभी तक कोई प्रगतिशील पाठ्यक्रम टेस्ट परिणाम उपलब्ध नहीं है।</p>`;
      return;
    }

    let html = "";
    data.forEach(item => {
      let dateStr = item.created_at ? new Date(item.created_at).toLocaleString('hi-IN') : '—';
      let timeTaken = item.time_taken ? `⏱️ ${item.time_taken}` : '⏱️ —';
      
      html += `
        <div class="result-card">
          <div class="result-header">
            <span>👤 ${item.student_name || "विद्यार्थी"} (${item.class_name || "—"})</span>
            <span class="score-badge">🎯 ${item.percentage}% (${item.correct_answers}/${item.total_questions})</span>
          </div>
          <div class="result-details">
            <span>📝 ${item.test_type || "प्रगतिशील पाठ्यक्रम टेस्ट"}</span>
            <span class="time-badge">${timeTaken}</span>
          </div>
          <div class="result-details" style="border-top:1px dashed #e2e8f0;margin-top:8px;padding-top:6px;">
            <span>📅 ${dateStr}</span>
            <span>ID: ${item.student_id || "—"}</span>
          </div>
        </div>
      `;
    });
    listEl.innerHTML = html;
  } catch (err) {
    console.error("Error loading results:", err);
    listEl.innerHTML = `<p style="text-align:center;color:#dc2626;font-size:14px;padding:10px;">त्रुटि: ${err.message || "कनेक्शन विफल रहा।"}</p>`;
  }
}

loadResults();
</script>
</body>
</html>
