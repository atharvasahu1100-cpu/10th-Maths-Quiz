<script>
    const webAppUrl = "https://script.google.com/macros/s/AKfycbwTstmVlqAkdRSRUM9xSNT0Irk9BhbegYMADme5FkOMVGtyaVzQeoyNyteHczLgyXzPvg/exec";

    fetch(webAppUrl)
        .then(response => response.json())
        .then(data => {
            document.getElementById('loading').style.display = 'none';
            const tbody = document.getElementById('table-body');
            document.getElementById('report-table').style.display = 'table';
            tbody.innerHTML = "";

            // यहाँ हमने लूप को 1 से शुरू करके data.length तक कर दिया है
            // ताकि सीरियल नंबर 1 से शुरू होकर क्रम में दिखे
            for (let i = 1; i < data.length; i++) {
                let row = data[i];
                
                let sno = row[0] || i;
                let date = row[1] || '';
                let name = row[3] || '';
                let mobile = row[4] || '';
                let rawScore = String(row[5] || "").trim();

                let displayScore = "";
                let grade = "";

                if (rawScore.includes("2026-") || rawScore.includes("1899-") || rawScore === "") {
                    displayScore = "पुराना रिकॉर्ड";
                    grade = "A+ (उत्कृष्ट)";
                } else {
                    displayScore = rawScore;
                    let scoreNum = parseInt(rawScore) || 0;
                    
                    if (scoreNum >= 9) grade = "A+ (उत्कृष्ट)";
                    else if (scoreNum >= 7) grade = "A (बहुत अच्छा)";
                    else if (scoreNum >= 5) grade = "B (अच्छा)";
                    else grade = "C (सुधार करें)";
                }

                let tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${sno}</td>
                    <td>${date}</td>
                    <td><b>${name}</b></td>
                    <td>${mobile}</td>
                    <td style="color: #0984e3; font-weight: bold;">${grade} (${displayScore})</td>
                `;
                tbody.appendChild(tr);
            }
        })
        .catch(error => {
            document.getElementById('loading').innerText = "डेटा लोड करने में त्रुटि हुई!";
            console.error('Error:', error);
        });
</script>
