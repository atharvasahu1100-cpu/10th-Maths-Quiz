<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>छात्रों का रिकॉर्ड - Rajesh Sir Maths</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f5f6fa; padding: 20px; }
        .container { max-width: 900px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #0984e3; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #dfe6e9; padding: 10px; text-align: center; font-size: 13px; }
        th { background: #0984e3; color: white; }
        tr:nth-child(even) { background: #f1f2f6; }
        .back-btn { display: inline-block; padding: 10px 15px; background: #636e72; color: white; text-decoration: none; border-radius: 6px; margin-bottom: 15px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" class="back-btn">← होम पेज</a>
    <h2>📊 छात्रों के टेस्ट का पूरा रिकॉर्ड (ग्रेड सिस्टम)</h2>
    <div id="loading" style="text-align: center; font-weight: bold; color: #636e72;">डेटा लोड हो रहा है, कृपया प्रतीक्षा करें...</div>

    <table id="report-table" style="display: none;">
        <thead>
            <tr>
                <th>क्र.सं.</th>
                <th>दिनांक</th>
                <th>छात्र का नाम</th>
                <th>मोबाइल</th>
                <th>प्रदर्शन (ग्रेड)</th>
            </tr>
        </thead>
        <tbody id="table-body"></tbody>
    </table>
</div>

<script>
    // आपका नवीनतम और सही Web App URL यहाँ जुड़ा हुआ है
    const webAppUrl = "https://script.google.com/macros/s/AKfycbxaxuBqb6M9Ikpch2_6peN7UF5ehnJkLxuZPp0B4rJEKE_801BdyWjx8hKfpi7u_IQLmw/exec";

    fetch(webAppUrl)
        .then(response => response.json())
        .then(data => {
            document.getElementById('loading').style.display = 'none';
            const tbody = document.getElementById('table-body');
            document.getElementById('report-table').style.display = 'table';

            for (let i = 1; i < data.length; i++) {
                let row = data[i];
                
                let sno = row[0] || i;
                let date = row[1] || '';
                let name = row[2] || '';
                let mobile = row[3] || '';
                let rawScore = String(row[4] || "पुराना रिकॉर्ड").trim();

                let cleanScore = rawScore.split('T')[0];
                if (cleanScore.includes("2026-") || cleanScore.includes("1899-") || cleanScore.length > 6) {
                    cleanScore = "पुराना रिकॉर्ड";
                }

                let scoreNum = parseInt(cleanScore) || 0;
                let grade = "";

                if (cleanScore === "पुराना रिकॉर्ड") {
                    grade = "उपलब्ध रिकॉर्ड";
                } else if (scoreNum >= 9) {
                    grade = "A+ (उत्कृष्ट)";
                } else if (scoreNum >= 7) {
                    grade = "A (बहुत अच्छा)";
                } else if (scoreNum >= 5) {
                    grade = "B (अच्छा)";
                } else {
                    grade = "C (सुधार करें)";
                }

                let tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${sno}</td>
                    <td>${date}</td>
                    <td><b>${name}</b></td>
                    <td>${mobile}</td>
                    <td style="color: #0984e3; font-weight: bold;">${grade} (${cleanScore})</td>
                `;
                tbody.appendChild(tr);
            }
        })
        .catch(error => {
            document.getElementById('loading').innerText = "डेटा लोड करने में त्रुटि हुई!";
            console.error('Error:', error);
        });
</script>

</body>
</html>
